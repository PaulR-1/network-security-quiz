    .opt:hover { border-color: var(--accent); }
    .opt.sel { border-color: var(--accent); background: #1d3358; }

    .opt.no { border-color: var(--bad); background: #3a1e24; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    button.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-size: 0.95rem; cursor: pointer; background: var(--accent); color: #fff; font-weight: 600; }
    button.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
    button.btn:disabled { opacity: .45; cursor: default; }

    .score { font-size: 2.2rem; font-weight: 700; margin: 8px 0; }

    a.exit { display: inline-block; margin: 0 0 16px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 7px 12px; border-radius: 8px; font-size: 0.85rem; }
    a.exit:hover { color: var(--text); border-color: var(--accent); }

  <script>
    const BANK = [{"id": 1, "type": "text", "q": "A field technician is setting up a new corporate branch and inspecting the physical cabling entering the facility. The physical location that officially separates the Customer Premises Equipment (CPE) from the service provider’s infrastructure is known as the demarcation point. The specific copper or fiber-optic cabling running from this demarcation point back to the provider’s Central Office (CO) is referred to as the", "show": "local loop", "accept": ["local loop", "the local loop", "subscriber loop", "last mile"], "answer": ["local loop"], "explain": "That cable is the local loop (also called the subscriber loop or last mile): the access line from the demarc back to the provider’s central office.", "whyWrong": "The demarcation point is the boundary named in the question. CPE is the customer’s own equipment on the near side of that boundary. The central office is the far end, not the cable itself."}, {"id": 2, "type": "single", "q": "A telecommunications service provider needs to expand the bandwidth capacity of its long-distance optical backbone network without laying new physical fiber-optic cables due to high excavation costs. Which Layer 1 optical technology allows the provider to transmit multiple data streams simultaneously over a single optical fiber line by using different wavelengths of light?", "options": ["Dense Wavelength Division Multiplexing (DWDM)", "Asynchronous Transfer Mode (ATM)", "High-Level Data Link Control (HDLC)", "Synchronous Digital Hierarchy (SDH)"], "answer": ["Dense Wavelength Division Multiplexing (DWDM)"], "why": {"Dense Wavelength Division Multiplexing (DWDM)": "DWDM is the Layer 1 method that puts many signals on one fiber by giving each stream its own wavelength of light.", "Asynchronous Transfer Mode (ATM)": "ATM is a cell-switching technology. It does not multiplex wavelengths onto a fiber.", "High-Level Data Link Control (HDLC)": "HDLC is a Layer 2 framing protocol for serial links, not an optical multiplexing method.", "Synchronous Digital Hierarchy (SDH)": "SDH is the framing hierarchy that rides on the fiber. It does not itself assign different wavelengths."}, "explain": "DWDM is the Layer 1 method that puts many signals on one fiber by giving each stream its own wavelength of light."}, {"id": 3, "type": "single", "q": "Which Traditional WAN Connectivity technology utilizes a cell-based architecture with small, fixed-length 53-byte frames?", "options": ["T1/E1 Leased Lines", "Frame Relay", "Asynchronous Transfer Mode (ATM)", "DSL"], "answer": ["Asynchronous Transfer Mode (ATM)"], "why": {"Asynchronous Transfer Mode (ATM)": "ATM carries traffic in fixed 53-byte cells: 5 bytes of header and 48 bytes of payload.", "T1/E1 Leased Lines": "T1/E1 is a dedicated digital circuit with a fixed bit rate, not a 53-byte cell architecture.", "Frame Relay": "Frame Relay uses variable-length frames, not fixed 53-byte cells.", "DSL": "DSL is a broadband access technology over telephone copper, not a cell-switching WAN core."}, "explain": "ATM carries traffic in fixed 53-byte cells: 5 bytes of header and 48 bytes of payload."}, {"id": 4, "type": "single", "q": "A global manufacturing company needs to connect its headquarters in New York to a new factory in Shanghai with a guaranteed, high-quality link for its real-time production data. Which type of WAN connectivity is generally chosen for its excellent QoS and performance guarantees?", "options": ["Satellite WAN", "MPLS (Multiprotocol Label Switching)", "DSL using public internet", "Standard VPN over the internet"], "answer": ["MPLS (Multiprotocol Label Switching)"], "why": {"MPLS (Multiprotocol Label Switching)": "MPLS is the usual choice when the requirement is a provider-backed path with QoS classes and performance guarantees.", "Satellite WAN": "Satellite adds large delay and is a poor fit for real-time production traffic.", "DSL using public internet": "DSL over the public internet is best-effort and does not guarantee quality.", "Standard VPN over the internet": "A VPN encrypts traffic on the internet. It does not add a bandwidth or latency guarantee."}, "explain": "MPLS is the usual choice when the requirement is a provider-backed path with QoS classes and performance guarantees."}, {"id": 5, "type": "text", "q": "A telecommunications service provider needs to expand the data-carrying capacity of its long-distance backbone optical infrastructure without incurring the extreme cost of installing new physical optical fiber lines. The provider deploys ____, which multiplexes multiple data streams simultaneously over existing SDH or SONET fiber by transmitting them using different wavelengths of light.", "show": "DWDM", "accept": ["DWDM", "dense wavelength division multiplexing", "dense wavelength division multiplexing (DWDM)", "dense WDM"], "answer": ["DWDM"], "explain": "That is DWDM, Dense Wavelength Division Multiplexing. Each stream gets its own wavelength, so existing SDH or SONET fiber carries many channels at once.", "whyWrong": "SDH and SONET are the framing systems already named in the question. They are what DWDM rides on, not the wavelength multiplexer itself."}, {"id": 6, "type": "single", "q": "Which Traditional WAN Connectivity method uses the public switched telephone network (PSTN) and is considered low bandwidth and typically used for backup or remote access?", "options": ["Frame Relay", "ATM", "Dial-up Modem/POTS", "T1/E1"], "answer": ["Dial-up Modem/POTS"], "why": {"Dial-up Modem/POTS": "Dial-up uses the public telephone network, is low bandwidth, and is the classic backup or remote-access circuit.", "Frame Relay": "Frame Relay is a packet-switched WAN service, not a PSTN modem call.", "ATM": "ATM is a high-speed cell-switching technology, not a low-bandwidth telephone backup.", "T1/E1": "T1/E1 is a dedicated leased circuit with far more bandwidth than a dial-up line."}, "explain": "Dial-up uses the public telephone network, is low bandwidth, and is the classic backup or remote-access circuit."}, {"id": 7, "type": "single", "q": "Which type of NAT allows multiple private IP addresses to share a single public IP address by using different port numbers?", "options": ["Port Address Translation (PAT)", "Dynamic NAT", "NAT64", "Static NAT"], "answer": ["Port Address Translation (PAT)"], "why": {"Port Address Translation (PAT)": "PAT, also called NAT overload, maps many private hosts to one public address by giving each session its own source port.", "Dynamic NAT": "Dynamic NAT maps one private address to one public address from a pool. It does not share one public address by port.", "NAT64": "NAT64 translates between IPv6 and IPv4. Port sharing is not what defines it.", "Static NAT": "Static NAT is a fixed one-to-one mapping, usually so a server keeps one public address."}, "explain": "PAT, also called NAT overload, maps many private hosts to one public address by giving each session its own source port."}, {"id": 8, "type": "single", "q": "A network engineer is provisioning a new branch location. The engineer connects an enterprise edge router (which routes subscriber LAN traffic) directly to a service provider’s optical modem inside the company’s server room. In standard WAN terminology, how is the customer-side router categorized?", "options": ["Data Terminal Equipment (DTE)", "Data Communications Equipment (DCE)", "Point-of-Presence (POP)", "Central Office Switch (CO)"], "answer": ["Data Terminal Equipment (DTE)"], "why": {"Data Terminal Equipment (DTE)": "The customer router is the DTE. It generates and receives the data and hands it to the provider’s modem.", "Data Communications Equipment (DCE)": "The DCE is the provider side of the link, here the optical modem, which clocks and puts the signal on the circuit.", "Point-of-Presence (POP)": "A POP is a provider location where customers connect, not the name of the customer router.", "Central Office Switch (CO)": "The central office switch sits in the provider’s facility, not in the customer server room."}, "explain": "The customer router is the DTE. It generates and receives the data and hands it to the provider’s modem."}, {"id": 9, "type": "single", "q": "In PAT, how are return packets directed back to the correct internal host?", "options": ["By tracking the combination of the destination public IP address and port number.", "By checking the destination IP address only.", "By the ARP table entries.", "By using a pre-configured static route."], "answer": ["By tracking the combination of the destination public IP address and port number."], "why": {"By tracking the combination of the destination public IP address and port number.": "The return packet is addressed to the public IP and the port PAT chose. The NAT table maps that pair back to the private host and port.", "By checking the destination IP address only.": "Many hosts share that one public address, so the IP alone cannot tell them apart.", "By the ARP table entries.": "ARP resolves a local IP to a MAC address. It does not store PAT translations.", "By using a pre-configured static route.": "A static route chooses a next hop. It does not reverse a port translation."}, "explain": "The return packet is addressed to the public IP and the port PAT chose. The NAT table maps that pair back to the private host and port."}, {"id": 10, "type": "text", "q": "A teleworker connects to the corporate network via an always-on DSL broadband line using existing twisted-pair telephone wiring. The DSL modem at the worker’s home converts Ethernet signals into a DSL format. At the provider’s Central Office (CO), traffic from multiple individual subscriber DSL connections is aggregated and concentrated into a device known as a", "show": "DSLAM", "accept": ["DSLAM", "DSL access multiplexer", "digital subscriber line access multiplexer", "a DSLAM"], "answer": ["DSLAM"], "explain": "That device is a DSLAM, a Digital Subscriber Line Access Multiplexer. It terminates many subscriber DSL lines at the central office and hands the aggregated traffic upstream.", "whyWrong": "The home DSL modem converts one household’s Ethernet into DSL. It does not concentrate every subscriber at the central office."}, {"id": 11, "type": "single", "q": "A network administrator notices that peer-to-peer applications and some VoIP services (like SIP) are failing after implementing NAT. This is primarily a manifestation of which NAT disadvantage?", "options": ["Breaking end-to-end IP address transparency.", "Increased latency due to translation lookups.", "Reduced network bandwidth.", "Increased CPU utilization on the router."], "answer": ["Breaking end-to-end IP address transparency."], "why": {"Breaking end-to-end IP address transparency.": "P2P and SIP often put the host’s own IP address inside the payload, or expect inbound connections to that address. NAT rewrites the header and hides the real address, so those sessions fail.", "Increased latency due to translation lookups.": "A table lookup adds very little delay and is not why these particular applications fail.", "Reduced network bandwidth.": "NAT does not shrink the link’s bandwidth.", "Increased CPU utilization on the router.": "Translation uses some CPU, but that is not the reason SIP and peer-to-peer break."}, "explain": "P2P and SIP often put the host’s own IP address inside the payload, or expect inbound connections to that address. NAT rewrites the header and hides the real address, so those sessions fail."}, {"id": 12, "type": "single", "q": "A company hosts a mission-critical web server with the private IP 192.168.1.10. This server must always be reachable from the internet using the public IP 203.0.113.5. What is the most appropriate NAT configuration for this requirement?", "options": ["Static NAT", "Dynamic NAT with overload", "Bi-directional NAT", "Port Address Translation (PAT)"], "answer": ["Static NAT"], "why": {"Static NAT": "Static NAT permanently maps 192.168.1.10 to 203.0.113.5, so outside clients can always reach that one server.", "Dynamic NAT with overload": "Overload shares public addresses and does not keep one private server pinned to one public address.", "Bi-directional NAT": "That is not the standard name for a permanent one-to-one server mapping. The configuration asked for is static NAT.", "Port Address Translation (PAT)": "PAT is for many inside hosts sharing a public address. It does not reserve 203.0.113.5 for this server alone."}, "explain": "Static NAT permanently maps 192.168.1.10 to 203.0.113.5, so outside clients can always reach that one server."}, {"id": 13, "type": "text", "q": "An enterprise needs a flexible WAN solution capable of interconnecting multiple offices using disparate access methods—such as Ethernet, Cable, and DSL—while encapsulating both IPv4 and IPv6 traffic. The service provider routes the traffic using ____, which employs Label Switched Routers (LSRs) to append labels to packets and forward them through the core provider cloud.", "show": "MPLS", "accept": ["MPLS", "multiprotocol label switching", "multi-protocol label switching", "multiprotocol label switching (MPLS)"], "answer": ["MPLS"], "explain": "That is MPLS. Label Switched Routers add a label and forward on the label, and the same label path can carry both IPv4 and IPv6 over mixed access types.", "whyWrong": "Ethernet, cable, and DSL are the access methods already named. They are not the label-switching core."}, {"id": 14, "type": "single", "q": "In a scenario using Dynamic NAT with an address pool, a private host is idle for an extended period. The NAT entry is subsequently removed by the router. This removal is based on the router’s:", "options": ["ARP table refresh rate.", "NAT Table Timeout (aging timer).", "External ISP disconnection.", "CPU load."], "answer": ["NAT Table Timeout (aging timer)."], "why": {"NAT Table Timeout (aging timer).": "Dynamic NAT entries are temporary. When the host is idle longer than the aging timer, the router deletes the mapping and returns the public address to the pool.", "ARP table refresh rate.": "ARP aging refreshes MAC mappings on the local segment. It does not remove NAT translations.", "External ISP disconnection.": "The ISP link staying up or down is separate from how long an idle translation is kept.", "CPU load.": "The router does not drop idle NAT entries because the CPU is busy."}, "explain": "Dynamic NAT entries are temporary. When the host is idle longer than the aging timer, the router deletes the mapping and returns the public address to the pool."}, {"id": 15, "type": "single", "q": "In the context of WAN Operations, the DTE (Data Terminal Equipment) is typically the:", "options": ["Carrier’s switch", "Customer’s router", "ISP’s router", "Local switch"], "answer": ["Customer’s router"], "why": {"Customer’s router": "DTE is the customer endpoint, typically the customer router that sends data onto the WAN.", "Carrier’s switch": "The carrier’s switch is provider equipment, on the DCE side of the circuit.", "ISP’s router": "The ISP router belongs to the provider, not the customer DTE.", "Local switch": "A local switch is not the standard name for the WAN DTE."}, "explain": "DTE is the customer endpoint, typically the customer router that sends data onto the WAN."}, {"id": 16, "type": "single", "q": "A regional logistics enterprise interconnects 30 branch office routers to a single central headquarters router using virtual circuits. During a scheduled hardware upgrade at headquarters, the central router experiences a power failure, causing all inter-spoke branch communication across the organization to halt instantly.", "options": ["Full-mesh topology virtual circuit drop", "Single-homed load balancing failure", "Point-to-Point transparent Layer 2 transit termination", "A hub router representing a single point of failure in a Hub-and-Spoke topology"], "answer": ["A hub router representing a single point of failure in a Hub-and-Spoke topology"], "why": {"A hub router representing a single point of failure in a Hub-and-Spoke topology": "Every branch circuit lands on one headquarters router. When that hub loses power, spoke-to-spoke traffic has no other path.", "Full-mesh topology virtual circuit drop": "A full mesh gives each site its own circuits to the others, so one site’s failure does not stop every other pair.", "Single-homed load balancing failure": "Load balancing needs more than one path. This design has a single central router, so there is nothing to balance.", "Point-to-Point transparent Layer 2 transit termination": "That phrase does not describe one hub taking down every branch."}, "explain": "Every branch circuit lands on one headquarters router. When that hub loses power, spoke-to-spoke traffic has no other path."}, {"id": 17, "type": "single", "q": "What is the primary function of NAT?", "options": ["To filter unwanted network packets.", "To assign dynamic IP addresses to hosts.", "To translate private IP addresses to public IP addresses.", "To encrypt network traffic."], "answer": ["To translate private IP addresses to public IP addresses."], "why": {"To translate private IP addresses to public IP addresses.": "NAT’s job is address translation, most often private inside addresses to public outside addresses.", "To filter unwanted network packets.": "Filtering is a firewall or ACL function. NAT may sit beside one, but filtering is not what NAT does.", "To assign dynamic IP addresses to hosts.": "Handing out addresses is DHCP.", "To encrypt network traffic.": "Encryption is a VPN or TLS function."}, "explain": "NAT’s job is address translation, most often private inside addresses to public outside addresses."}, {"id": 18, "type": "multi", "need": 2, "q": "A telecommunications company is transitioning its core network to IPv6 but must maintain access to legacy services that only run on IPv4. Which two statements describe the solution they must implement?", "options": ["The implementation involves a NAT64 mechanism.", "Static NAT is the required translation type.", "The solution is typically referred to as NAT Overload.", "The IPv6-only clients can reach IPv4 services without requiring dual-stack.", "The primary goal is to hide the internal IPv4 addresses."], "answer": ["The implementation involves a NAT64 mechanism.", "The IPv6-only clients can reach IPv4 services without requiring dual-stack."], "why": {"The implementation involves a NAT64 mechanism.": "NAT64 is the translator that lets an IPv6-only network talk to IPv4-only services.", "The IPv6-only clients can reach IPv4 services without requiring dual-stack.": "With NAT64, the clients stay IPv6-only. They do not each need an IPv4 address.", "Static NAT is the required translation type.": "Static NAT is a permanent IPv4-to-IPv4 mapping. It does not translate between IPv6 and IPv4.", "The solution is typically referred to as NAT Overload.": "NAT overload is PAT, many IPv4 hosts sharing one IPv4 address. It is not the IPv6 transition tool.", "The primary goal is to hide the internal IPv4 addresses.": "Hiding inside addresses is a side effect of ordinary NAT. Here the goal is IPv6 clients reaching IPv4 servers."}, "explain": "NAT64 is the translator that lets an IPv6-only network talk to IPv4-only services. With NAT64, the clients stay IPv6-only. They do not each need an IPv4 address.", "hint": "Select two, then check."}, {"id": 19, "type": "single", "q": "An organization is transitioning from IPv4 to IPv6 and needs to allow IPv6 clients to communicate with IPv4 servers. Which NAT type will facilitate this?", "options": ["Static NAT", "NAT64", "Dynamic NAT", "PAT (Port Address Translation)"], "answer": ["NAT64"], "why": {"NAT64": "NAT64 translates IPv6 client packets into IPv4 so those clients can reach IPv4 servers.", "Static NAT": "Static NAT maps one IPv4 address to another IPv4 address.", "Dynamic NAT": "Dynamic NAT assigns IPv4 pool addresses to IPv4 hosts.", "PAT (Port Address Translation)": "PAT shares one IPv4 address among IPv4 hosts. It does not translate IPv6."}, "explain": "NAT64 translates IPv6 client packets into IPv4 so those clients can reach IPv4 servers."}, {"id": 21, "type": "single", "q": "In a NAT64 setup, the server that hosts the service being accessed must be an:", "options": ["Internal private server.", "IPv6 server.", "IPv4 server.", "IPv4 or IPv6 server."], "answer": ["IPv4 server."], "why": {"IPv4 server.": "NAT64 is used when the client is IPv6 and the service being reached is IPv4. The server in this setup is an IPv4 server.", "Internal private server.": "The server can be anywhere on the IPv4 side. “Internal private” is not the requirement.", "IPv6 server.": "An IPv6 server would not need NAT64 to be reached by an IPv6 client.", "IPv4 or IPv6 server.": "NAT64 is specifically the bridge to an IPv4 service, not either kind of server."}, "explain": "NAT64 is used when the client is IPv6 and the service being reached is IPv4. The server in this setup is an IPv4 server."}, {"id": 22, "type": "single", "q": "A company is closing its branch offices and moving all resources to a centralized cloud platform. The primary purpose of the WAN now shifts from connecting offices to connecting the company to the internet backbone. Which connectivity type is now the most critical?", "options": ["Frame Relay", "ISDN", "T1 Leased Lines", "High-speed Internet access (e.g., dedicated Ethernet/broadband)"], "answer": ["High-speed Internet access (e.g., dedicated Ethernet/broadband)"], "why": {"High-speed Internet access (e.g., dedicated Ethernet/broadband)": "Once the destination is the cloud, the WAN’s job is a fast path onto the internet backbone.", "Frame Relay": "Frame Relay was for connecting offices through a provider cloud, which is the purpose this company is leaving.", "ISDN": "ISDN is a low-speed switched telephone service, not the critical path to a cloud platform.", "T1 Leased Lines": "A T1 is a small dedicated circuit, too limited to be the main internet attachment for a cloud move."}, "explain": "Once the destination is the cloud, the WAN’s job is a fast path onto the internet backbone."}, {"id": 23, "type": "single", "q": "A multinational corporation needs to link disparate sites that utilize varying local access methods—including Metro Ethernet, Cable, and DSL. The service provider requires a routing solution that appends labels to both IPv4 and IPv6 packets to forward them efficiently across the provider core. Which modern WAN technology satisfies this operational requirement?", "options": ["Integrated Services Digital Network (ISDN)", "Frame Relay Data-Link Connection Identifiers (DLCI)", "Multiprotocol Label Switching (MPLS)", "Public Switched Telephone Network (PSTN)"], "answer": ["Multiprotocol Label Switching (MPLS)"], "why": {"Multiprotocol Label Switching (MPLS)": "MPLS appends a label to either IPv4 or IPv6 and forwards on that label across the provider core, independent of the access type.", "Integrated Services Digital Network (ISDN)": "ISDN is a circuit-switched telephone service. It does not label IP packets.", "Frame Relay Data-Link Connection Identifiers (DLCI)": "A DLCI identifies a Frame Relay virtual circuit. It is not a label applied to both IPv4 and IPv6 in a modern core.", "Public Switched Telephone Network (PSTN)": "The PSTN is the public telephone network, not a labeled packet core."}, "explain": "MPLS appends a label to either IPv4 or IPv6 and forwards on that label across the provider core, independent of the access type."}, {"id": 24, "type": "single", "q": "Which type of Traditional WAN connection guarantees a dedicated, symmetrical link between two fixed points?", "options": ["Cable Broadband", "Dial-up Modem", "Leased Line (e.g., T1/E1)", "DSL"], "answer": ["Leased Line (e.g., T1/E1)"], "why": {"Leased Line (e.g., T1/E1)": "A leased line is a dedicated circuit between two fixed sites, with the same rate in both directions.", "Cable Broadband": "Cable is a shared access service and is typically asymmetrical.", "Dial-up Modem": "Dial-up is an on-demand telephone call, not a dedicated permanent link.", "DSL": "DSL is usually asymmetrical and is an access service, not a dedicated symmetrical circuit between two sites."}, "explain": "A leased line is a dedicated circuit between two fixed sites, with the same rate in both directions."}, {"id": 25, "type": "single", "q": "A key advantage of using NAT is:", "options": ["Hiding internal network structure and providing a security layer.", "Simplification of network troubleshooting.", "Guaranteed end-to-end connectivity for all applications.", "Increased network security by exposing internal IP addresses."], "answer": ["Hiding internal network structure and providing a security layer."], "why": {"Hiding internal network structure and providing a security layer.": "Outside hosts see the public address, not the private layout, so NAT hides the inside network.", "Simplification of network troubleshooting.": "NAT makes troubleshooting harder because the address on the wire is not the host’s real address.", "Guaranteed end-to-end connectivity for all applications.": "NAT breaks end-to-end transparency. It does not guarantee it.", "Increased network security by exposing internal IP addresses.": "Exposing inside addresses would remove the hiding benefit. NAT does the opposite."}, "explain": "Outside hosts see the public address, not the private layout, so NAT hides the inside network."}, {"id": 26, "type": "single", "q": "A network engineer is designing a WAN for a startup that prioritizes low initial cost and flexible scalability, even if it means sacrificing some bandwidth guarantees. Which connectivity approach aligns best with this strategy?", "options": ["Dedicated Fiber Leased Lines", "T3/E3 Leased Lines", "Internet-Based Connectivity (e.g., site-to-site VPNs)", "ATM circuits"], "answer": ["Internet-Based Connectivity (e.g., site-to-site VPNs)"], "why": {"Internet-Based Connectivity (e.g., site-to-site VPNs)": "Internet V options": ["NAT64", "Dynamic NAT with a pool of 5,000 addresses", "Port Address Translation (PAT)", "Static NAT"], "answer": ["Port Address Translation (PAT)"], "why": {"Port Address Translation (PAT)": "PAT lets all 5,000 hosts share the one public address by tracking each session’s port.", "NAT64": "NAT64 translates IPv6 to IPv4. This network’s problem is too many IPv4 hosts for one public IPv4 address.", "Dynamic NAT with a pool of 5,000 addresses": "A pool of 5,000 public addresses contradicts the fact that the ISP assigned only one.", "Static NAT": "Static NAT would permanently map one inside host to that single public address, leaving the other 4,999 with no mapping."}, "explain": "PAT lets all 5,000 hosts share the one public address by tracking each session’s port."}, {"id": 31, "type": "single", "q": "A company decides to migrate its legacy Frame Relay network to a newer, packet-switched technology that still relies on a provider’s shared infrastructure but offers better speeds and service-level agreements (SLAs). Which Modern WAN Connectivity technology is the most common replacement?", "options": ["Carrier Ethernet", "ISDN", "T1 Leased Lines", "PSTN (Dial-up)"], "answer": ["Carrier Ethernet"], "why": {"Carrier Ethernet": "Carrier Ethernet is the usual replacement for Frame Relay: still a provider service, still shared infrastructure, with higher speeds and SLAs.", "ISDN": "ISDN is an older, slower telephone service, not a faster packet WAN.", "T1 Leased Lines": "A T1 is a dedicated circuit, not a shared packet-switched replacement, and it is slower than modern carrier Ethernet.", "PSTN (Dial-up)": "Dial-up is low-bandwidth telephone access, not an upgrade from Frame Relay."}, "explain": "Carrier Ethernet is the usual replacement for Frame Relay: still a provider service, still shared infrastructure, with higher speeds and SLAs."}, {"id": 32, "type": "multi", "need": 2, "q": "Network Address Translation (NAT) introduces challenges for certain network protocols and applications. Which two statements reflect major disadvantages or problems caused by NAT?", "options": ["It makes the router’s NAT table too small to manage.", "It significantly increases network latency for all traffic.", "It forces the network to use private IP address ranges.", "It breaks the principle of end-to-end connectivity/transparency.", "It interferes with applications that embed IP addresses in their payload (e.g., FTP, some VoIP)."], "answer": ["It breaks the principle of end-to-end connectivity/transparency.", "It interferes with applications that embed IP addresses in their payload (e.g., FTP, some VoIP)."], "why": {"It breaks the principle of end-to-end connectivity/transparency.": "After NAT, the address the outside sees is not the host’s real address, so the original end-to-end model no longer holds.", "It interferes with applications that embed IP addresses in their payload (e.g., FTP, some VoIP).": "NAT rewrites the header. An application that also writes its address inside the payload is left with an address that no longer matches.", "It makes the router’s NAT table too small to manage.": "Table size is a capacity choice. NAT does not inherently make the table too small.", "It significantly increases network latency for all traffic.": "The translation lookup is small. Latency is not a major NAT disadvantage.", "It forces the network to use private IP address ranges.": "Private ranges are what NAT translates. NAT does not force a network to use them, and using them is not the problem."}, "explain": "After NAT, the address the outside sees is not the host’s real address, so the original end-to-end model no longer holds. NAT rewrites the header. An application that also writes its address inside the payload is left with an address that no longer matches.", "hint": "Select two, then check."}, {"id": 34, "type": "multi", "need": 2, "q": "You are troubleshooting a failed internet connection for a host using Dynamic NAT. You confirm the privat     const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const tag = (q) => (typeof q.id === "number" ? ("#" + q.id) : "Matching");

    let deck = [];
    let i = 0;
    let correct = 0;
    let locked = false;
    let missed = [];
    let picked = new Set();

    const panel = document.getElementById("panel");
    const prog = document.getElementById("prog");
    const count = document.getElementById("count");
    const scoreline = document.getElementById("scoreline");

    function start(pool) {
      deck = shuffle(pool.map((q) => {
        if (q.type === "match") return { ...q, items: shuffle(q.items) };
        if (q.type === "text") return { ...q };
        return { ...q, options: shuffle(q.options) };
      }));
      i = 0; correct = 0; missed = []; locked = false; picked = new Set();
      render();
    }

    function render() {
      if (i >= deck.length) return results();
      const q = deck[i];
      prog.style.width = ((i / deck.length) * 100) + "%";
      count.textContent = "Question " + (i + 1) + " of " + deck.length + "  ·  " + tag(q);
      scoreline.textContent = "Score " + correct;
      locked = false; picked = new Set();

      if (q.type === "text") {
        panel.innerHTML = `<p class="q">${esc(q.q)}</p>
          <p class="hint">Type the term, then check.</p>
          <input class="blank" id="blank" type="text" autocomplete="off" spellcheck="false" />
          <div class="actions"><button class="btn" id="check">Check</button></div>
          <div class="fb" id="fb"></div>`;
        document.getElementById("check").onclick = () => checkText(q);
        document.getElementById("blank").addEventListener("keydown", (e) => {
          if (e.key === "Enter") checkText(q);
        });
        return;
      }

      if (q.type === "match") {
        const opts = (q.choices || []).map((c) => `<option value="${c.v}">${esc(c.l)}</option>`).join("");
        panel.innerHTML = `<p class="q">${esc(q.q)}</p>
          <p class="hint">${esc(q.hint || "Classify each item.")}</p>
          <div class="match">${q.items.map((item, idx) => `
            <div class="row">
              <span>${esc(item)}</span>
              <select data-item="${idx}">
                <option value="">Choose…</option>
                ${opts}
              </select>
            </div>`).join("")}</div>
          <div class="actions"><button class="btn" id="check">Check</button></div>
          <div class="fb" id="fb"></div>`;
        document.getElementById("check").onclick = checkMatch;
        return;
      }

      const need = q.need || (q.type === "multi" ? q.answer.length : 1);
      panel.innerHTML = `<p class="q">${esc(q.q)}</p>
        ${q.type === "multi" ? `<p class="hint">${esc(q.hint || ("Select " + need + ", then check."))}</p>` : ""}
        <div id="opts">${q.options.map((opt) => `<button class="opt" data-v="${encodeURIComponent(opt)}">${esc(opt)}</button>`).join("")}</div>
        <div class="actions">
          ${q.type === "multi" ? `<button class="btn" id="check" disabled>Check</button>` : ""}
        </div>
        <div class="fb" id="fb"></div>`;

      panel.querySelectorAll(".opt").forEach((btn) => {
        btn.onclick = () => {
          if (locked) return;
          const v = decodeURIComponent(btn.dataset.v);
          if (q.type === "single") {
            picked = new Set([v]);
            finish(q);
          } else {
            if (picked.has(v)) picked.delete(v); else {
              if (picked.size >= need) return;
              picked.add(v);
            }
            panel.querySelectorAll(".opt").forEach((b) => {
              b.classList.toggle("sel", picked.has(decodeURIComponent(b.dataset.v)));
            });
            document.getElementById("check").disabled = picked.size !== need;
          }
        };
      });
      const check = document.getElementById("check");
      if (check) check.onclick = () => finish(q);
    }

    function checkText(q) {
      if (locked) return;
      const raw = document.getElementById("blank").value;
      const ok = (q.accept || []).some((a) => norm(a) === norm(raw));
      locked = true;
      const input = document.getElementById("blank");
      input.disabled = true;
      input.classList.add(ok ? "ok" : "no");
      after(ok, q, ok ? "Correct." : ("Answer: " + q.show));
    }

    function checkMatch() {
      if (locked) return;
      const q = deck[i];
      const selects = [...panel.querySelectorAll("select")];
      if (selects.some((s) => !s.value)) return;
      locked = true;
      let ok = true;
      selects.forEach((s, idx) => {
        const item = q.items[idx];
        const good = s.value === q.map[item];
        if (!good) ok = false;
        s.classList.add(good ? "ok" : "no");
      });
      after(ok, q, q.explain || "Review the classifications.");
    }

    function finish(q) {
      if (locked) return;
      locked = true;
      const chosen = [...picked];
      const ok = same(chosen, q.answer);
      panel.querySelectorAll(".opt").forEach((b) => {
        const v = decodeURIComponent(b.dataset.v);
        b.disabled = true;
        if (q.answer.includes(v)) b.classList.add("ok");
        else if (picked.has(v)) b.classList.add("no");
      });
      after(ok, q, q.explain || ("Correct: " + q.answer.join(" · ")));
    }

    function reasonBlock(q) {
      if (q.type === "text") {
        return `<p class="why-h">WHY THIS IS RIGHT</p><p>${esc(q.explain || "")}</p>` +
          (q.whyWrong ? `<p class="why-h">WHY THE OTHERS ARE WRONG</p><p>${esc(q.whyWrong)}</p>` : "");
      }
      if (q.type === "match") {
        const labels = {};
        (q.choices || []).forEach((c) => { labels[c.v] = c.l; });
        const lines = (q.items || []).map((item) => `<li><b>${esc(item)}</b> — ${esc(labels[q.map[item]] || q.map[item])}</li>`).join("");
        return `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${lines}</ul><p>${esc(q.explain || "")}</p>`;
      }
      const why = q.why || {};
      const right = (q.answer || []).map((a) => `<li><b>${esc(a)}</b> — ${esc(why[a] || q.explain || "")}</li>`).join("");
      const wrong = (q.options || []).filter((o) => !(q.answer || []).includes(o)).map((o) => `<li><b>${esc(o)}</b> — ${esc(why[o] || "")}</li>`).join("");
      return `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${right}</ul>` +
        (wrong ? `<p class="why-h">WHY THE OTHERS ARE WRONG</p><ul class="why">${wrong}</ul>` : "");
    }

    function after(ok, q, msg) {
      if (ok) correct++; else missed.push({ q: q.q, label: tag(q), msg });
      const fb = document.getElementById("fb");
      fb.className = "fb " + (ok ? "ok" : "no");
      fb.textContent = ok ? "Correct." : (q.type === "text" ? msg : "Not quite.");
      let box = document.getElementById("reasons");
      if (!box) {
        box = document.createElement("div");
        box.id = "reasons";
        fb.after(box);
      }
      box.innerHTML = reasonBlock(q);
      scoreline.textContent = "Score " + correct;
      const actions = panel.querySelector(".actions");
      actions.innerHTML = `<button class="btn" id="next">${i + 1 === deck.length ? "See results" : "Next"}</button>`;
      document.getElementById("next").onclick = () => { i++; render(); };
    }

    function results() {
      prog.style.width = "100%";
      count.textContent = "Round complete";
      scoreline.textContent = "";
      const pct = Math.round((correct / deck.length) * 100);
      panel.innerHTML = `
        <p class="q">You scored</p>
        <div class="score">${correct} / ${deck.length}</div>
        <p class="sub" style="margin:0">${pct}% · ${missed.length ? missed.length + " to review" : "Clean round."}</p>
        ${missed.length ? `<ul class="miss">${missed.map((m) => `<li><b>${esc(m.label)} ${esc(m.q)}</b><br>${esc(m.msg)}</li>`).join("")}</ul>` : ""}
        <div class="actions">
          <a class="btn ghost" href="index.html">Exit module</a>
          <button class="btn" id="again">Play again (shuffle)</button>
          ${missed.length ? `<button class="btn ghost" id="missed">Replay missed only</button>` : ""}
        </div>`;
      document.getElementById("again").onclick = () => start(BANK);
      const missBtn = document.getElementById("missed");
      if (missBtn) {
        missBtn.onclick = () => {
          const ids = new Set(missed.map((m) => m.q));
          start(BANK.filter((q) => ids.has(q.q)));
        };
      }
    }

    start(BANK);
  </script>
</body>
</html>
