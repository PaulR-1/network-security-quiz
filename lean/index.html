<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lean validation exam</title>
  <link rel="stylesheet" href="../theme.css" />
  <style>
    .row { grid-template-columns: 1fr minmax(9.5rem, 15rem); }
    a.brief { color: #8eb6ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="exit" href="../index.html">All reviewers</a>
    <h1>Lean validation exam</h1>
    <p class="sub">Fourteen questions from the exam photos, numbered the way they appeared. Validation Board, Customer Development, Scrum of Scrums, LeSS, Kanban, and TDD. A miss shows why. <a class="brief" href="lean-validation-brief.pdf">Crash-course brief (PDF)</a></p>
    <div class="bar"><i id="prog"></i></div>
    <div class="meta">
      <span id="count"></span>
      <span id="scoreline"></span>
    </div>
    <div class="card" id="panel"></div>
  </div>
  <script>
    const BANK = [{"exam": 11, "type": "single", "q": "An IT student team developing a Cloud Microservices Cost Optimizer conducts 10 user discovery interviews with DevOps engineers. 8 out of 10 engineers state that AWS bill reduction is 'extremely important,' but when asked to grant read-only IAM access to a sandbox script to audit their actual cluster cost usage, only 1 engineer consents. How should the IT team interpret this outcome according to the Validation Board framework?", "options": ["Pivot or re-evaluate the Problem/Customer hypothesis because verbal statements failed to translate into customer currency (granting IAM access/behavioral commitment).", "Persevere with the current product pitch because 80% expressed verbal interest in AWS bill reduction.", "Terminate the project immediately and replace the student lead with a senior DevOps consultant.", "Increase the permissions requested in the IAM policy to require administrative control."], "answer": ["Pivot or re-evaluate the Problem/Customer hypothesis because verbal statements failed to translate into customer currency (granting IAM access/behavioral commitment)."], "why": {"Pivot or re-evaluate the Problem/Customer hypothesis because verbal statements failed to translate into customer currency (granting IAM access/behavioral commitment).": "The Validation Board treats currency and behavior as evidence. Eight people saying the problem is important is a pitch; only one granting access is the commitment. The hypothesis is not validated.", "Persevere with the current product pitch because 80% expressed verbal interest in AWS bill reduction.": "Verbal interest is not customer currency. The board asks whether people give up something, and here almost nobody did.", "Terminate the project immediately and replace the student lead with a senior DevOps consultant.": "An invalidated experiment calls for a pivot of the hypothesis, not for firing the team.", "Increase the permissions requested in the IAM policy to require administrative control.": "Asking for more access raises the cost of the ask. It does not explain why stated interest failed to become a commitment."}, "explain": "Opinions are not validation. Only one engineer paid the currency of granting access, so the team should pivot or re-test the customer and problem hypothesis."}, {"exam": 14, "type": "single", "q": "In Lean Software Development and Customer Discovery, when an experiment invalidates a core technical or problem assumption, the methodology requires 'firing the hypothesis/plan' rather than 'firing the engineering team'.", "options": ["True", "False"], "answer": ["True"], "why": {"True": "A failed experiment kills the assumption, not the people who ran it. The next step is to pivot the plan.", "False": "Firing the team is the opposite of the rule. The hypothesis is what gets discarded."}, "explain": "Invalidate the plan. Keep the team and change the hypothesis."}, {"exam": 15, "type": "single", "q": "Large Scale Scrum (LeSS) requires every individual feature team to maintain its own completely separate, isolated Product Backlog.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "LeSS uses one Product Backlog for the product, shared by the feature teams.", "False": "Separate backlogs would split the product. LeSS keeps a single Product Backlog and one Product Owner."}, "explain": "LeSS does not give each team its own backlog. There is one Product Backlog."}, {"exam": 16, "type": "single", "q": "An IT team is setting up their initial Validation Board canvas for an automated container orchestration monitoring tool. In what precise order must the canvas components be populated and tested?", "options": ["Customer Segment -> Problem Hypothesis -> Riskiest Assumption -> Solution Hypothesis.", "Riskiest Assumption -> Solution Hypothesis -> Customer Segment.", "Docker Deployment Pipeline -> Unit Tests -> Customer Segment.", "Solution Architecture -> Customer Segment -> Problem Hypothesis."], "answer": ["Customer Segment -> Problem Hypothesis -> Riskiest Assumption -> Solution Hypothesis."], "why": {"Customer Segment -> Problem Hypothesis -> Riskiest Assumption -> Solution Hypothesis.": "The board starts with who the customer is and what problem they have. You name the riskiest assumption before you commit to a solution. The board's own tip is not to define a solution until the problem is validated.", "Riskiest Assumption -> Solution Hypothesis -> Customer Segment.": "The riskiest assumption is chosen from the customer and problem hypotheses. It is not the first sticky, and the customer is not last.", "Docker Deployment Pipeline -> Unit Tests -> Customer Segment.": "A deployment pipeline and unit tests are engineering work. They are not the order of the Validation Board canvas.", "Solution Architecture -> Customer Segment -> Problem Hypothesis.": "Starting with the solution is the mistake the board warns against. Customer and problem come first."}, "explain": "Fill customer, then problem, then the riskiest assumption. Do not lock the solution until the problem has evidence."}, {"exam": 17, "type": "single", "q": "Which of the following is NOT one of the three core Validation Methods defined in the Lean Customer Development framework?", "options": ["Static Code Inspection Method", "Pitching Method", "Concierge Method", "Exploration Method"], "answer": ["Static Code Inspection Method"], "why": {"Static Code Inspection Method": "The Validation Board names three experiment methods: Exploration, Pitch, and Concierge. Static code inspection is a code-quality practice, not one of those methods.", "Pitching Method": "Pitch is one of the three. You ask the customer for currency in exchange for solving the problem.", "Concierge Method": "Concierge is one of the three. You deliver the service by hand to a few customers before building the product.", "Exploration Method": "Exploration is one of the three. You interview and observe to learn the problem before you pitch a solution."}, "explain": "Exploration, Pitch, and Concierge are the three methods. Static code inspection is not."}, {"exam": 18, "type": "single", "q": "Test-Driven Development (TDD) in XP requires software engineers to write production code first and then generate unit tests afterwards.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "TDD writes the failing test first, then the production code that makes it pass, then refactors.", "False": "Production code first is the reverse of TDD. The test comes before the code."}, "explain": "TDD is test first: red, green, refactor. Production code does not come first."}, {"exam": 21, "type": "single", "q": "A team building an AI-powered code review assistant manually inspects pull requests and emails handwritten feedback to 10 beta developer teams every evening, intentionally postponing the development of Machine Learning parsing models. What is the strategic engineering rationale for using this Concierge (Wizard of Oz) approach?", "options": ["To validate that developers value and act on the feedback before investing heavy engineering effort into complex AI/ML backend automation.", "Because manual code reviews provide higher AES-256 data encryption than automated AI pipelines.", "To fulfill Waterfall documentation requirements before starting the software design phase.", "To trick users into believing the student team has already secured patent protection for their AI model."], "answer": ["To validate that developers value and act on the feedback before investing heavy engineering effort into complex AI/ML backend automation."], "why": {"To validate that developers value and act on the feedback before investing heavy engineering effort into complex AI/ML backend automation.": "Concierge delivers the service manually so you learn whether customers want it before you build the expensive system. That is the Wizard of Oz pattern.", "Because manual code reviews provide higher AES-256 data encryption than automated AI pipelines.": "Encryption strength is not why the team is doing the work by hand.", "To fulfill Waterfall documentation requirements before starting the software design phase.": "Concierge is a learning experiment, not a Waterfall document gate.", "To trick users into believing the student team has already secured patent protection for their AI model.": "The point is to test value, not to fake a patent."}, "explain": "Do the job by hand first. Build the model only after developers show they value the feedback."}, {"exam": 22, "type": "single", "q": "What is the functional difference between Scrum of Scrums (SoS) and Large Scale Scrum (LeSS) for multi-team coordination?", "options": ["SoS uses team representatives meeting at scaled daily standups; LeSS scales Scrum by sharing a single Product Backlog and sprint cadence across teams.", "There is no difference; they are identical frameworks.", "SoS is for Waterfall; LeSS is for Kanban.", "SoS requires 1,000 developers; LeSS is limited to 3 developers."], "answer": ["SoS uses team representatives meeting at scaled daily standups; LeSS scales Scrum by sharing a single Product Backlog and sprint cadence across teams."], "why": {"SoS uses team representatives meeting at scaled daily standups; LeSS scales Scrum by sharing a single Product Backlog and sprint cadence across teams.": "Scrum of Scrums is a coordination meeting of team representatives. LeSS is a framework: one Product Owner, one Product Backlog, and teams in the same sprint.", "There is no difference; they are identical frameworks.": "SoS is a meeting technique. LeSS is a full scaling framework with one backlog.", "SoS is for Waterfall; LeSS is for Kanban.": "Both sit in the Scrum family. Neither one is Waterfall, and LeSS is not Kanban.", "SoS requires 1,000 developers; LeSS is limited to 3 developers.": "Those head-count limits are not the difference. LeSS is typically a handful of feature teams, not a three-person cap."}, "explain": "SoS coordinates through representatives. LeSS shares one Product Backlog and one sprint cadence."}, {"exam": 23, "type": "single", "q": "IT startups and innovative software project teams should operate in 'Search Mode' (hypotheses testing) before transitioning into 'Execution Mode' (scaling production software).", "options": ["True", "False"], "answer": ["True"], "why": {"True": "Customer Development separates search, where you test hypotheses, from execution, where you scale a model that has evidence.", "False": "Skipping search and scaling production first is how teams build something nobody wants."}, "explain": "Search first, then execute. Test the hypotheses before you scale the software."}, {"exam": 24, "type": "single", "q": "How does the Validation Board define the 'Riskiest Assumption' in a software project hypothesis?", "options": ["The core unproven assumption that has the least evidence and whose invalidation would cause the entire software concept to fail.", "The technical feature that requires the most complex SQL query optimization.", "The UI button color that developers disagree on during sprint planning.", "The cloud hosting provider with the highest monthly invoice."], "answer": ["The core unproven assumption that has the least evidence and whose invalidation would cause the entire software concept to fail."], "why": {"The core unproven assumption that has the least evidence and whose invalidation would cause the entire software concept to fail.": "A core assumption is anything that breaks the business if it is false. The riskiest one is the least certain of those.", "The technical feature that requires the most complex SQL query optimization.": "Implementation difficulty is not what makes an assumption the riskiest. Failure of the business is.", "The UI button color that developers disagree on during sprint planning.": "A color debate is not a core assumption. Invalidating it would not kill the concept.", "The cloud hosting provider with the highest monthly invoice.": "The largest bill is a cost, not the assumption whose failure collapses the hypothesis."}, "explain": "The riskiest assumption is the unproven belief that would sink the whole concept if it is wrong."}, {"exam": 25, "type": "single", "q": "Achieving 1,000 unique page views on a documentation website for an open-source software tool definitively proves that enterprise IT teams will pay monthly license fees for an enterprise edition.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "Page views are not payment. The board wants currency, such as a purchase or a commitment, before you treat willingness to pay as proven.", "False": "Traffic does not prove that an enterprise team will pay a license fee."}, "explain": "A thousand page views do not prove anyone will pay for an enterprise edition."}, {"exam": 27, "type": "single", "q": "What are the three primary hypothesis sticky types placed on the Validation Board canvas?", "options": ["Customer, Problem, Solution.", "Agile, Scrum, Kanban.", "Unit Test, Integration Test, Deployment.", "Frontend, Backend, Database."], "answer": ["Customer, Problem, Solution."], "why": {"Customer, Problem, Solution.": "The board's core hypotheses are the Customer Hypothesis, the Problem Hypothesis, and the Solution Hypothesis.", "Agile, Scrum, Kanban.": "Those are delivery methods, not the three hypothesis stickies.", "Unit Test, Integration Test, Deployment.": "Those are engineering stages, not the canvas hypotheses.", "Frontend, Backend, Database.": "Those are system layers, not Customer, Problem, and Solution."}, "explain": "The three hypothesis stickies are Customer, Problem, and Solution."}, {"exam": 29, "type": "single", "q": "Kanban relies on fixed-length, timeboxed iterations (sprints) to schedule software releases.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "Kanban is a continuous flow with a limit on work in progress. Fixed-length sprints belong to Scrum.", "False": "Timeboxed sprints are a Scrum practice, not a Kanban requirement."}, "explain": "Kanban does not schedule work in sprints. Scrum does."}, {"exam": 30, "type": "single", "q": "'Get Out Of The Building' (GOOTB) is a core Customer Development directive co-founded by Steve Blank that urges builders to gather direct evidence from real users rather than sitting in the lab.", "options": ["True", "False"], "answer": ["True"], "why": {"True": "Steve Blank's Customer Development rule is to leave the building and learn from real customers instead of debating inside the lab.", "False": "Staying in the lab is what GOOTB tells you not to do."}, "explain": "Get out of the building. Evidence comes from real users, not from the lab."}];

    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
    let deck = [];
    let i = 0;
    let correct = 0;
    let locked = false;
    let missed = [];
    let picked = new Set();
    const panel = document.getElementById("panel");
    const prog = document.getElementById("prog");
    const count = document.getElementById("count");
    const scoreline = document.getElementById("scoreline");
    function start(pool) {
      deck = shuffle(pool.map((q) => {
        if (q.type === "match") return { ...q, items: shuffle(q.items) };
        return { ...q, options: shuffle(q.options) };
      }));
      i = 0; correct = 0; missed = []; locked = false; picked = new Set();
      render();
    }
    function render() {
      if (i >= deck.length) return results();
      const q = deck[i];
      prog.style.width = ((i / deck.length) * 100) + "%";
      count.textContent = "Question " + (i + 1) + " of " + deck.length + (q.exam ? "  ·  Exam #" + q.exam : "");
      scoreline.textContent = "Score " + correct;
      locked = false; picked = new Set();
      if (q.type === "match") {
        const opts = (q.choices || []).map((c) => `<option value="${c.v}">${esc(c.l)}</option>`).join("");
        panel.innerHTML = `<p class="q">${esc(q.q)}</p>
          <p class="hint">${esc(q.hint || "Classify each item.")}</p>
          <div class="match">${q.items.map((item, idx) => `
            <div class="row">
              <span>${esc(item)}</span>
              <select data-item="${idx}">
                <option value="">Choose…</option>
                ${opts}
              </select>
            </div>`).join("")}</div>
          <div class="actions"><button class="btn" id="check" type="button">Check</button></div>
          <div class="fb" id="fb"></div>`;
        document.getElementById("check").onclick = checkMatch;
        return;
      }
      const need = q.answer.length;
      panel.innerHTML = `<p class="q">${esc(q.q)}</p>
        ${q.type === "multi" ? `<p class="hint">Select ${need}, then check.</p>` : `<p class="hint">Pick one answer.</p>`}
        <div id="opts">${q.options.map((opt) => `<button class="opt" type="button" data-v="${encodeURIComponent(opt)}">${esc(opt)}</button>`).join("")}</div>
        <div class="actions">
          ${q.type === "multi" ? `<button class="btn" id="check" type="button" disabled>Check</button>` : ""}
        </div>
        <div class="fb" id="fb"></div>`;
      panel.querySelectorAll(".opt").forEach((btn) => {
        btn.onclick = () => {
          if (locked) return;
          const v = decodeURIComponent(btn.dataset.v);
          if (q.type === "single") {
            picked = new Set([v]);
            finish(q);
          } else {
            if (picked.has(v)) picked.delete(v); else {
              if (picked.size >= need) return;
              picked.add(v);
            }
            panel.querySelectorAll(".opt").forEach((b) => {
              b.classList.toggle("sel", picked.has(decodeURIComponent(b.dataset.v)));
            });
            document.getElementById("check").disabled = picked.size !== need;
          }
        };
      });
      const check = document.getElementById("check");
      if (check) check.onclick = () => finish(q);
    }
    function checkMatch() {
      if (locked) return;
      const q = deck[i];
      const selects = [...panel.querySelectorAll("select")];
      if (selects.some((s) => !s.value)) {
        const fb = document.getElementById("fb");
        fb.className = "fb no";
        fb.textContent = "Choose a category for every row.";
        return;
      }
      locked = true;
      let ok = true;
      selects.forEach((s, idx) => {
        const item = q.items[idx];
        const good = s.value === q.map[item];
        if (!good) ok = false;
        s.classList.add(good ? "ok" : "no");
      });
      after(ok, q, q.explain || "Review the classifications.");
    }
    function finish(q) {
      if (locked) return;
      locked = true;
      const chosen = [...picked];
      const ok = same(chosen, q.answer);
      panel.querySelectorAll(".opt").forEach((b) => {
        const v = decodeURIComponent(b.dataset.v);
        b.disabled = true;
        if (q.answer.includes(v)) b.classList.add("ok");
        else if (picked.has(v)) b.classList.add("no");
      });
      after(ok, q, q.explain || ("Correct: " + q.answer.join(" · ")));
    }
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    function reasonBlock(q) {
      if (q.type === "match") {
        const labels = {};
        (q.choices || []).forEach((c) => { labels[c.v] = c.l; });
        const lines = (q.items || []).map((item) => `<li><b>${esc(item)}</b> — ${esc(labels[q.map[item]] || q.map[item])}</li>`).join("");
        return `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${lines}</ul><p>${esc(q.explain || "")}</p>`;
      }
      const why = q.why || {};
      const right = (q.answer || []).map((a) => `<li><b>${esc(a)}</b> — ${esc(why[a] || q.explain || "")}</li>`).join("");
      const wrong = (q.options || []).filter((o) => !(q.answer || []).includes(o)).map((o) => `<li><b>${esc(o)}</b> — ${esc(why[o] || "")}</li>`).join("");
      return `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${right}</ul>` +
        (wrong ? `<p class="why-h">WHY THE OTHERS ARE WRONG</p><ul class="why">${wrong}</ul>` : "");
    }
    function after(ok, q, msg) {
      if (ok) correct++; else missed.push({ q: q.q, msg });
      const fb = document.getElementById("fb");
      fb.className = "fb " + (ok ? "ok" : "no");
      fb.textContent = ok ? "Correct." : "Not quite.";
      let box = document.getElementById("reasons");
      if (!box) {
        box = document.createElement("div");
        box.id = "reasons";
        fb.after(box);
      }
      box.innerHTML = reasonBlock(q);
      scoreline.textContent = "Score " + correct;
      const actions = panel.querySelector(".actions");
      const next = document.createElement("button");
      next.className = "btn";
      next.type = "button";
      next.id = "next";
      next.textContent = i + 1 === deck.length ? "See results" : "Next";
      actions.replaceChildren(next);
      next.onclick = () => { i++; render(); };
    }
    function results() {
      prog.style.width = "100%";
      count.textContent = "Round complete";
      scoreline.textContent = "";
      const pct = Math.round((correct / deck.length) * 100);
      panel.innerHTML = `
        <p class="q">You scored</p>
        <div class="score">${correct} / ${deck.length}</div>
        <p class="sub" style="margin:0">${pct}% · ${missed.length ? missed.length + " to review" : "Clean round."}</p>
        ${missed.length ? `<ul class="miss">${missed.map((m) => `<li><b>${esc(m.q)}</b><br>${esc(m.msg)}</li>`).join("")}</ul>` : ""}
        <div class="actions">
          <a class="btn ghost" href="index.html">All modules</a>
          <button class="btn" id="again" type="button">Play again (shuffle)</button>
          ${missed.length ? `<button class="btn ghost" id="missed" type="button">Replay missed only</button>` : ""}
        </div>`;
      document.getElementById("again").onclick = () => start(BANK);
      const missBtn = document.getElementById("missed");
      if (missBtn) {
        missBtn.onclick = () => {
          const ids = new Set(missed.map((m) => m.q));
          start(BANK.filter((q) => ids.has(q.q)));
        };
      }
    }
    start(BANK);

  </script>
</body>
</html>
