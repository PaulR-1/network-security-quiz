pped", "Only placeholder text for an empty field", "A vertically scrolling column of widgets", "The IDE status and warnings"], "answer": ["An image from resources or a URI, which can be scaled or cropped"], "why": {"An image from resources or a URI, which can be scaled or cropped": "The module says an ImageView displays an image from resources or a URI and can scale or crop it.", "Only placeholder text for an empty field": "Placeholder text is android:hint on an EditText.", "A vertically scrolling column of widgets": "Vertical scrolling is a ScrollView.", "The IDE status and warnings": "Status and warnings belong to the Android Studio status bar."}, "explain": "An ImageView displays an image from resources or a URI, and the image can be scaled or cropped.", "source": "Module 2, ImageView"}, {"type": "single", "q": "Which attribute sets an ImageView's image source?", "options": ["android:src", "android:hint", "android:text", "android:id"], "answer": ["android:src"], "why": {"android:src": "The ImageView table says android:src specifies the image source.", "android:hint": "android:hint is the empty EditText placeholder.", "android:text": "android:text is the text shown on a text control or Button.", "android:id": "android:id identifies the view. It does not choose the image."}, "explain": "android:src specifies the ImageView's image source.", "source": "Module 2, android:src"}, {"type": "single", "q": "What is android:contentDescription for?", "options": ["Text for accessibility", "A tint applied over the image", "How the image is scaled, such as centerCrop", "The click handler in Kotlin"], "answer": ["Text for accessibility"], "why": {"Text for accessibility": "The ImageView table says android:contentDescription provides text for accessibility.", "A tint applied over the image": "The tint is android:tint.", "How the image is scaled, such as centerCrop": "Scaling and positioning are android:scaleType.", "The click handler in Kotlin": "A click handler is setOnClickListener. contentDescription is accessibility text."}, "explain": "android:contentDescription provides accessibility text for the ImageView.", "source": "Module 2, android:contentDescription"}, {"type": "single", "q": "What does android:scaleType control?", "options": ["How the image is resized and positioned, such as fitXY, centerCrop, and centerInside", "The accessibility text", "A color tint over the image", "Whether the ImageView is hidden"], "answer": ["How the image is resized and positioned, such as fitXY, centerCrop, and centerInside"], "why": {"How the image is resized and positioned, such as fitXY, centerCrop, and centerInside": "The module names android:scaleType for resizing and positioning and gives those examples.", "The accessibility text": "Accessibility text is android:contentDescription.", "A color tint over the image": "The tint is android:tint.", "Whether the ImageView is hidden": "Visibility is android:visibility, not scaleType."}, "explain": "android:scaleType controls how the image is resized and positioned. The module names fitXY, centerCrop, and centerInside.", "source": "Module 2, android:scaleType"}, {"type": "multi", "q": "Which scaleType values does the module name? (Select 3)", "options": ["fitXY", "centerCrop", "centerInside", "match_parent"], "answer": ["fitXY", "centerCrop", "centerInside"], "why": {"fitXY": "fitXY is one of the scaleType examples in the ImageView table.", "centerCrop": "centerCrop is one of the scaleType examples in the ImageView table.", "centerInside": "centerInside is one of the scaleType examples in the ImageView table.", "match_parent": "match_parent is a layout size value, not a scaleType name in this module."}, "explain": "The named scaleType examples are fitXY, centerCrop, and centerInside.", "source": "Module 2, scaleType values"}, {"type": "single", "q": "What is centerCrop, according to the quick review?", "options": ["It fills the ImageView while preserving aspect ratio, and the excess may be cropped", "It shows the empty-field placeholder", "It hides the view and frees its layout space", "It sets the text size in scale-independent pixels"], "answer": ["It fills the ImageView while preserving aspect ratio, and the excess may be cropped"], "why": {"It fills the ImageView while preserving aspect ratio, and the excess may be cropped": "The quick review defines centerCrop that way.", "It shows the empty-field placeholder": "The empty-field placeholder is android:hint.", "It hides the view and frees its layout space": "Hiding a view and freeing its space is GONE.", "It sets the text size in scale-independent pixels": "Text size uses sp. centerCrop is an ImageView scale type."}, "explain": "centerCrop fills the ImageView, keeps the aspect ratio, and may crop the excess.", "source": "Quick review, centerCrop"}, {"type": "single", "q": "What does android:tint do on an ImageView?", "options": ["Applies a tint to the image", "Provides accessibility text", "Chooses the image file or URI", "Limits the image to one line of text"], "answer": ["Applies a tint to the image"], "why": {"Applies a tint to the image": "The ImageView table says android:tint applies a tint to the image.", "Provides accessibility text": "Accessibility text is android:contentDescription.", "Chooses the image file or URI": "The image source is android:src.", "Limits the image to one line of text": "android:maxLines limits text lines. It is not the image tint."}, "explain": "android:tint applies a tint to the ImageView image.", "source": "Module 2, android:tint"}];

    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
    let deck = [];
    let i = 0;
    let correct = 0;
    let locked = false;
    let missed = [];
    let picked = new Set();
    const panel = document.getElementById("panel");
    const prog = document.getElementById("prog");
    const count = document.getElementById("count");
    const scoreline = document.getElementById("scoreline");
    function start(pool) {
      deck = shuffle(pool.map((q) => {
        if (q.type === "match") return { ...q, items: shuffle(q.items) };
        return { ...q, options: shuffle(q.options) };
      }));
      i = 0; correct = 0; missed = []; locked = false; picked = new Set();
      render();
    }
    function render() {
      if (i >= deck.length) return results();
      const q = deck[i];
      prog.style.width = ((i / deck.length) * 100) + "%";
      count.textContent = "Question " + (i + 1) + " of " + deck.length;
      scoreline.textContent = "Score " + correct;
      locked = false; picked = new Set();
      if (q.type === "match") {
        const opts = (q.choices || []).map((c) => `<option value="${c.v}">${esc(c.l)}</option>`).join("");
        panel.innerHTML = `<p class="q">${esc(q.q)}</p>
          <p class="hint">${esc(q.hint || "Classify each item.")}</p>
          <div class="match">${q.items.map((item, idx) => `
            <div class="row">
              <span>${esc(item)}</span>
              <select data-item="${idx}">
                <option value="">Choose…</option>
                ${opts}
              </select>
            </div>`).join("")}</div>
          <div class="actions"><button class="btn" id="check" type="button">Check</button></div>
          <div class="fb" id="fb"></div>`;
        document.getElementById("check").onclick = checkMatch;
        return;
      }
      const need = q.answer.length;
      panel.innerHTML = `<p class="q">${esc(q.q)}</p>
        ${q.type === "multi" ? `<p class="hint">Select ${need}, then check.</p>` : `<p class="hint">Pick one answer.</p>`}
        <div id="opts">${q.options.map((opt) => `<button class="opt" type="button" data-v="${encodeURIComponent(opt)}">${esc(opt)}</button>`).join("")}</div>
        <div class="actions">
          ${q.type === "multi" ? `<button class="btn" id="check" type="button" disabled>Check</button>` : ""}
        </div>
        <div class="fb" id="fb"></div>`;
      panel.querySelectorAll(".opt").forEach((btn) => {
        btn.onclick = () => {
          if (locked) return;
          const v = decodeURIComponent(btn.dataset.v);
          if (q.type === "single") {
            picked = new Set([v]);
            finish(q);
          } else {
            if (picked.has(v)) picked.delete(v); else {
              if (picked.size >= need) return;
              picked.add(v);
            }
            panel.querySelectorAll(".opt").forEach((b) => {
              b.classList.toggle("sel", picked.has(decodeURIComponent(b.dataset.v)));
            });
            document.getElementById("check").disabled = picked.size !== need;
          }
        };
      });
      const check = document.getElementById("check");
      if (check) check.onclick = () => finish(q);
    }
    function checkMatch() {
      if (locked) return;
      const q = deck[i];
      const selects = [...panel.querySelectorAll("select")];
      if (selects.some((s) => !s.value)) {
        const fb = document.getElementById("fb");
        fb.className = "fb no";
        fb.textContent = "Choose a category for every row.";
        return;
      }
      locked = true;
      let ok = true;
      selects.forEach((s, idx) => {
        const item = q.items[idx];
        const good = s.value === q.map[item];
        if (!good) ok = false;
        s.classList.add(good ? "ok" : "no");
      });
      after(ok, q, q.explain || "Review the classifications.");
    }
    function finish(q) {
      if (locked) return;
      locked = true;
      const chosen = [...picked];
      const ok = same(chosen, q.answer);
      panel.querySelectorAll(".opt").forEach((b) => {
        const v = decodeURIComponent(b.dataset.v);
        b.disabled = true;
        if (q.answer.includes(v)) b.classList.add("ok");
        else if (picked.has(v)) b.classList.add("no");
      });
      after(ok, q, q.explain || ("Correct: " + q.answer.join(" · ")));
    }
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    function reasonBlock(q) {
      if (q.type === "match") {
        const labels = {};
        (q.choices || []).forEach((c) => { labels[c.v] = c.l; });
        const lines = (q.items || []).map((item) => `<li><b>${esc(item)}</b> — ${esc(labels[q.map[item]] || q.map[item])}</li>`).join("");
        return `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${lines}</ul><p>${esc(q.explain || "")}</p>`;
      }
      const why = q.why || {};
      const right = (q.answer || []).map((a) => `<li><b>${esc(a)}</b> — ${esc(why[a] || q.explain || "")}</li>`).join("");
      const wrong = (q.options || []).filter((o) => !(q.answer || []).includes(o)).map((o) => `<li><b>${esc(o)}</b> — ${esc(why[o] || "")}</li>`).join("");
      return `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${right}</ul>` +
        (wrong ? `<p class="why-h">WHY THE OTHERS ARE WRONG</p><ul class="why">${wrong}</ul>` : "");
    }
    function after(ok, q, msg) {
      if (ok) correct++; else missed.push({ q: q.q, msg });
      const fb = document.getElementById("fb");
      fb.className = "fb " + (ok ? "ok" : "no");
      fb.textContent = ok ? "Correct." : "Not quite.";
      let box = document.getElementById("reasons");
      if (!box) {
        box = document.createElement("div");
        box.id = "reasons";
        fb.after(box);
      }
      box.innerHTML = reasonBlock(q);
      scoreline.textContent = "Score " + correct;
      const actions = panel.querySelector(".actions");
      const next = document.createElement("button");
      next.className = "btn";
      next.type = "button";
      next.id = "next";
      next.textContent = i + 1 === deck.length ? "See results" : "Next";
      actions.replaceChildren(next);
      next.onclick = () => { i++; render(); };
    }
    function results() {
      prog.style.width = "100%";
      count.textContent = "Round complete";
      scoreline.textContent = "";
      const pct = Math.round((correct / deck.length) * 100);
      panel.innerHTML = `
        <p class="q">You scored</p>
        <div class="score">${correct} / ${deck.length}</div>
        <p class="sub" style="margin:0">${pct}% · ${missed.length ? missed.length + " to review" : "Clean round."}</p>
        ${missed.length ? `<ul class="miss">${missed.map((m) => `<li><b>${esc(m.q)}</b><br>${esc(m.msg)}</li>`).join("")}</ul>` : ""}
        <div class="actions">
          <a class="btn ghost" href="index.html">All modules</a>
          <button class="btn" id="again" type="button">Play again (shuffle)</button>
          ${missed.length ? `<button class="btn ghost" id="missed" type="button">Replay missed only</button>` : ""}
        </div>`;
      document.getElementById("again").onclick = () => start(BANK);
      const missBtn = document.getElementById("missed");
      if (missBtn) {
        missBtn.onclick = () => {
          const ids = new Set(missed.map((m) => m.q));
          start(BANK.filter((q) => ids.has(q.q)));
        };
      }
    }
    start(BANK);

  </script>
