gin is space outside the View boundary. Padding is space inside it.", "source": "Module 3, margin"}, {"type": "single", "q": "What is dp used for?", "options": ["Density-independent pixels, for View dimensions, margins, and padding", "Text size that follows the user's font-size preference", "A visibility value that keeps empty space", "The Kotlin assignment operator"], "answer": ["Density-independent pixels, for View dimensions, margins, and padding"], "why": {"Density-independent pixels, for View dimensions, margins, and padding": "The frequently tested table assigns dp to dimensions, margins, and padding.", "Text size that follows the user's font-size preference": "Text size that respects font-size preferences uses sp.", "A visibility value that keeps empty space": "The visibility value that keeps space is INVISIBLE.", "The Kotlin assignment operator": "Assignment is =. dp is a dimension unit."}, "explain": "dp means density-independent pixels, used for dimensions, margins, and padding.", "source": "Module 3, dp"}, {"type": "single", "q": "What is sp used for?", "options": ["Scale-independent pixels, recommended for text size, and they respect font-size preferences", "Width, height, margin, and padding", "Hiding a view without leaving a gap", "Comparing two Kotlin values for equality"], "answer": ["Scale-independent pixels, recommended for text size, and they respect font-size preferences"], "why": {"Scale-independent pixels, recommended for text size, and they respect font-size preferences": "The table says sp is for text size and respects font-size preferences.", "Width, height, margin, and padding": "Those dimensions use dp.", "Hiding a view without leaving a gap": "Hiding a view without leaving space is GONE.", "Comparing two Kotlin values for equality": "Equality comparison is ==. sp is the text-size unit."}, "explain": "sp means scale-independent pixels. Use it for text size so font-size preferences are respected.", "source": "Module 3, sp"}, {"type": "singl  "why": {"A unique identifier so Kotlin or Java code can reference the View": "The layout-attribute table says id / android:id is the unique identifier used from Kotlin or Java.", "The direction of children in a LinearLayout": "Child direction is orientation.", "Space outside the View": "Outer space is margin.", "The image tint": "Image tint is android:tint."}, "explain": "android:id uniquely identifies a View so code can reference it.", "source": "Module 3, android:id"}];

      next.textContent = i + 1 === deck.length ? "See results" : "Next";
      actions.replaceChildren(next);
      next.onclick = () => { i++; render(); };
    }
    function results() {
      prog.style.width = "100%";
      count.textContent = "Round complete";
      scoreline.textContent = "";
      const pct = Math.round((correct / deck.length) * 100);
      panel.innerHTML = `
        <p class="q">You scored</p>
        <div class="score">${correct} / ${deck.length}</div>
        <p class="sub" style="margin:0">${pct}% · ${missed.length ? missed.length + " to review" : "Clean round."}</p>
        ${missed.length ? `<ul class="miss">${missed.map((m) => `<li><b>${esc(m.q)}</b><br>${esc(m.msg)}</li>`).join("")}</ul>` : ""}
        <div class="actions">
          <a class="btn ghost" href="index.html">All modules</a>
          <button class="btn" id="again" type="button">Play again (shuffle)</button>
          ${missed.length ? `<button class="btn ghost" id="missed" type="button">Replay missed only</button>` : ""}
        </div>`;
      document.getElementById("again").onclick = () => start(BANK);
      const missBtn = document.getElementById("missed");
      if (missBtn) {
        missBtn.onclick = () => {
          const ids = new Set(missed.map((m) => m.q));
          start(BANK.filter((q) => ids.has(q.q)));
        };
      }
    }
    start(BANK);

  </script>
</body>
</html>
