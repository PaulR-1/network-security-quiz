ctivity to another as a key-value pair.", "Reads a String extra back out of the Intent": "Reading a String extra is getStringExtra.", "Shows the value in a Toast only": "A Toast is a temporary message. putExtra attaches data to the Intent.", "Declares the XML id": "The XML id is android:id. putExtra attaches data to an Intent."}, "explain": "putExtra adds a key-value pair to the Intent for the next Activity.", "source": "UI concepts, putExtra"}, {"type": "single", "q": "What does intent.getStringExtra(key) do?", "options": ["Retrieves a String extra that was sent with the matching key", "Puts a new extra onto the outgoing Intent", "Converts any EditText to a String without an Intent", "Finishes the current Activity"], "answer": ["Retrieves a String extra that was sent with the matching key"], "why": {"Retrieves a String extra that was sent with the matching key": "The table says getStringExtra retrieves a String extra using the matching key.", "Puts a new extra onto the outgoing Intent": "Adding an extra is putExtra.", "Converts any EditText to a String without an Intent": "Reading a field directly is text.toString(). getStringExtra reads an Intent extra.", "Finishes the current Activity": "Ending the Activity is finish()."}, "explain": "getStringExtra retrieves a String extra by its key.", "source": "UI concepts, getStringExtra"}, {"type": "single", "q": "What does startActivity(intent) do?", "options": ["Starts the Activity specified by the Intent", "Connects a layout and does not open another screen", "Deletes the extra named username", "Hides a View with GONE"], "answer": ["Starts the Activity specified by the Intent"], "why": {"Starts the Activity specified by the Intent": "The table says startActivity launches the Activity described by the Intent.", "Connects a layout and does not open another screen": "Connecting a layout is setContentView. startActivity opens the Activity in the Intent.", "Deletes the extra named username": "The sample stores username with putExtra. startActivity opens the destination.", "Hides a View with GONE": "GONE is a visibility value. startActivity launches an Activity."}, "explain": "startActivity(intent) opens the Activity the Intent describes.", "source": "UI concepts, startActivity"}, {"type": "single", "q": "What does finish() do in the Login → Profile sample?", "options": ["Ends the current Activity so Back does not return to Login after navigating away", "Saves the username into the Intent", "Reloads activity_main", "Runs onStart and stays on Login"], "answer": ["Ends the current Activity so Back does not return to Login after navigating away"], "why": {"Ends the current Activity so Back does not return to Login after navigating away": "The table says finish() ends the current Activity and can prevent Back from returning to Login.", "Saves the username into the Intent": "The username is added with putExtra.", "Reloads activity_main": "activity_main is attached with setContentView. finish() ends the Activity.", "Runs onStart and stays on Login": "onStart makes an Activity visible. finish() ends Login so Back does not return to it."}, "explain": "finish() ends Login so the Back button does not return to it after opening Profile.", "source": "UI concepts, finish"}, {"type": "single", "q": "In the Login sample, which line sends the username to Profile?", "options": ["intent.putExtra(\"username\", username), after the text is read inside the login button's click listener", "tvUsername.text = username, inside LoginActivity", "intent.getStringExtra(\"username\"), before the Intent is created", "setContentView(R.layout.activity_main)"], "answer": ["intent.putExtra(\"username\", username), after the text is read inside the login button's click listener"], "why": {"intent.putExtra(\"username\", username), after the text is read inside the login button's click listener": "The sample reads etUsername, builds an Intent to ProfileActivity, then putExtra(\"username\", username) before startActivity.", " t in that TextView": "The code table says this assignment changes or displays text in a TextView.", "Declares the XML id @+id/tvUsername": "The id is declared in XML with android:id. This line sets the text.", "Creates the Intent": "The Intent is created with the Intent constructor.", "Chooses Toast.LENGTH_LONG": "LENGTH_LONG is a Toast duration. This line sets TextView text."}, "explain": "tvUsername.text = username sets the text shown in that TextView.", "source": "UI concepts, set text"}];

    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
    let deck = [];
    let i = 0;
    let correct = 0;
    let locked = false;
    let missed = [];
    let picked = new Set();
    const panel = document.getElementById("panel");
    const prog = document.getElementById("prog");
    const count = document.getElementById("count");
    const scoreline = document.getElementById("scoreline");
    function start(pool) {
      deck = shuffle(pool.map((q) => {
        if (q.type === "match") return { ...q, items: shuffle(q.items) };
        return { ...q, options: shuffle(q.options) };
      }));
      i = 0; correct = 0; missed = []; locked = false; picked = new Set();
      render();
    }
    function render() {
      if (i >= deck.length) return results();
      const q = deck[i];
      prog.style.width = ((i / deck.length) * 100) + "%";
      count.textContent = "Question " + (i + 1) + " of " + deck.length;
      scoreline.textContent = "Score " + correct;
      locked = false; picked = new Set();
      if (q.type === "match") {
        const opts = (q.choices || []).map((c) => `<option value="${c.v}">${esc(c.l)}</option>`).join("");
        panel.innerHTML = `<p class="q">${esc(q.q)}</p>
          <p class="hint">${esc(q.hint || "Classify each item.")}</p>
          <div class="match">${q.items.map((item, idx) => `
            <div class="row">
              <span>${esc(item)}</span>
              <select data-item="${idx}">
                <option value="">Choose…</option>
                ${opts}
              </select>
            </div>`).join("")}</div>
          <div class="actions"><button class="btn" id="check" type="button">Check</button></div>
          <div class="fb" id="fb"></div>`;
        document.getElementById("check").onclick = checkMatch;
        return;
      }
      const need = q.answer.length;
      panel.innerHTML = `<p class="q">${esc(q.q)}</p>
        ${q.type === "multi" ? `<p class="hint">Select ${need}, then check.</p>` : `<p class="hint">Pick one answer.</p>`}
        <div id="opts">${q.options.map((opt) => `<button class="opt" type="button" data-v="${encodeURIComponent(opt)}">${esc(opt)}</button>`).join("")}</div>
        <div class="actions">
          ${q.type === "multi" ? `<button class="btn" id="check" type="button" disabled>Check</button>` : ""}
        </div>
        <div class="fb" id="fb"></div>`;
      panel.querySelectorAll(".opt").forEach((btn) => {
        btn.onclick = () => {
          if (locked) return;
          const v = decodeURIComponent(btn.dataset.v);
          if (q.type === "single") {
            picked = new Set([v]);
            finish(q);
          } else {
            if (picked.has(v)) picked.delete(v); else {
              if (picked.size >= need) return;
              picked.add(v);
            }
            panel.querySelectorAll(".opt").forEach((b) => {
              b.classList.toggle("sel", picked.has(decodeURIComponent(b.dataset.v)));
            });
            document.getElementById("check").disabled = picked.size !== need;
          }
        };
      });
      const check = document.getElementById("check");
      if (check) check.onclick = () => finish(q);
    }
    function checkMatch() {
      if (locked) return;
      const q = deck[i];
      const selects = [...panel.querySelectorAll("select")];
      if (selects.some((s) => !s.value)) {
        const fb = document.getElementById("fb");
        fb.className = "fb no";
        fb.textContent = "Choose a category for every row.";
        return;
      }
      locked = true;
      let ok = true;
      selects.forEach((s, idx) => {
        const item = q.items[idx];
        const good = s.value === q.map[item];
        if (!good) ok = false;
        s.classList.add(good ? "ok" : "no");
      });
      after(ok, q, q.explain || "Review the classifications.");
    }
    function finish(q) {
      if (locked) return;
      locked = true;
      const chosen = [...picked];
      const ok = same(chosen, q.answer);
      panel.querySelectorAll(".opt").forEach((b) => {
        const v = decodeURIComponent(b.dataset.v);
        b.disabled = true;
        if (q.answer.includes(v)) b.classList.add("ok");
        else if (picked.has(v)) b.classList.add("no");
      });
      after(ok, q, q.explain || ("Correct: " + q.answer.join(" · ")));
    }
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    function reasonBlock(q) {
      if (q.type === "match") {
        const labels = {};
        (q.choices || []).forEach((c) => { labels[c.v] = c.l; });
        const lines = (q.items || []).map((item) => `<li><b>${esc(item)}</b> — ${esc(labels[q.map[item]] || q.map[item])}</li>`).join("");
        return `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${lines}</ul><p>${esc(q.explain || "")}</p>`;
      }
      const why = q.why || {};
      const right = (q.answer || []).map((a) => `<li><b>${esc(a)}</b> — ${esc(why[a] || q.explain || "")}</li>`).join("");
      const wrong = (q.options || []).filter((o) => !(q.answer || []).includes(o)).map((o) => `<li><b>${esc(o)}</b> — ${esc(why[o] || "")}</li>`).join("");
      return `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${right}</ul>` +
        (wrong ? `<p class="why-h">WHY THE OTHERS ARE WRONG</p><ul class="why">${wrong}</ul>` : "");
    }
    function after(ok, q, msg) {
      if (ok) correct++; else missed.push({ q: q.q, msg });
      const fb = document.getElementById("fb");
      fb.className = "fb " + (ok ? "ok" : "no");
      fb.textContent = ok ? "Correct." : "Not quite.";
      let box = document.getElementById("reasons");
      if (!box) {
        box = document.createElement("div");
        box.id = "reasons";
        fb.after(box);
      }
      box.innerHTML = reasonBlock(q);
      scoreline.textContent = "Score " + correct;
      const actions = panel.querySelector(".actions");
      const next = document.createElement("button");
      next.className = "btn";
      next.type = "button";
      next.id = "next";
      next.textContent = i + 1 === deck.length ? "See results" : "Next";
      actions.replaceChildren(next);
      next.onclick = () => { i++; render(); };
    }
    function results() {
      prog.style.width = "100%";
      count.textContent = "Round complete";
      scoreline.textContent = "";
      const pct = Math.round((correct / deck.length) * 100);
      panel.innerHTML = `
        <p class="q">You scored</p>
        <div class="score">${correct} / ${deck.length}</div>
        <p class="sub" style="margin:0">${pct}% · ${missed.length ? missed.length + " to review" : "Clean round."}</p>
        ${missed.length ? `<ul class="miss">${missed.map((m) => `<li><b>${esc(m.q)}</b><br>${esc(m.msg)}</li>`).join("")}</ul>` : ""}
        <div class="actions">
          <a class="btn ghost" href="index.html">All modules</a>
          <button class="btn" id="again" type="button">Play again (shuffle)</button>
          ${missed.length ? `<button class="btn ghost" id="missed" type="button">Replay missed only</button>` : ""}
        </div>`;
      document.getElementById("again").onclick = () => start(BANK);
      const missBtn = document.getElementById("missed");
      if (missBtn) {
        missBtn.onclick = () => {
          const ids = new Set(missed.map((m) => m.q));
          start(BANK.filter((q) => ids.has(q.q)));
        };
      }
    }
    start(BANK);

  </script>
