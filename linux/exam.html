function loosen(s) {
  const quotes = [];
  const masked = s.replace(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/g, (m) => {
    quotes.push(m);
    return "\u0000Q" + (quotes.length - 1) + "Q\u0000";
  });
  const tight = masked
    .replace(/\s*>>\s*/g, "\u0000R\u0000")
    .replace(/\s*>\s*/g, ">")
    .replace(/\u0000R\u0000/g, ">>")
    .replace(/\s*&&\s*/g, "&&")
    .replace(/\s*;\s*/g, ";")
    .replace(/\s*=\s*/g, "=")
    .replace(/\s+/g, " ")
    .trim();
  return tight.replace(/\u0000Q(\d+)Q\u0000/g, (_, i) => quotes[+i]);
}
function norm(raw) {
  let s = String(raw).replace(/^\s*[$#]\s*/, "").trim().replace(/\s+/g, " ");
  s = loosen(s);
  return s.split(" ").filter(Boolean).map((tok) => tok.replace(/([^/])\/+$/, "$1")).join(" ");
}
function accepted(input, forms) {
  const n = norm(input);
  return forms.some((f) => norm(f) === n);
}

ll there.", "rm oldfile newfile": "rm deletes. It does not rename a file to a new name.", "rename -p oldfile newfile": "this reviewer uses mv to rename, not rename -p."}}, {"q": "Which command removes a file while prompting before deletion?", "options": ["rm -r filename", "rm -i filename", "rmdir filename", "del -p filename"], "answer": "rm -i filename", "why": {"rm -i filename": "rm -i asks for confirmation before it deletes the file.", "rm -r filename": "rm -r is recursive removal, not a confirmation prompt.", "rmdir filename": "rmdir removes an empty directory, not a file, and it does not use the -i prompt.", "del -p filename": "del -p is not the Linux command in this material."}}, {"q": "What does touch newfile.txt do according to the reviewer?", "options": ["Creates a 0-byte file or updates its timestamp", "Deletes the file", "Displays file contents", "Copies the file"], "answer": "Creates a 0-byte file or updates its timestamp", "why": {"Creates a 0-byte file or updates its timestamp": "touch creates the file at 0 bytes when the name is new, and updates the timestamp when the file already exists.", "Deletes the file": "touch does not delete the file.", "Displays file contents": "touch does not print the file. cat, head, tail, more, and less are the viewing commands.", "Copies the file": "copying is cp. touch does not duplicate the file."}}, {"q": "What does touch -a file.txt change?", "options": ["The access time", "The file owner", "The file size", "The filename"], "answer": "The access time", "why": {"The access time": "touch -a changes the access time.", "The file owner": "the owner is changed with chown, not touch -a.", "The file size": "touch does not set the file size.", "The filename": "touch does not rename the file. mv does."}}, {"q": "What does touch -m file.txt change?", "options": ["The modification time", "The group ID", "The permissions only", "The directory location"], "answer": "The modification time", "why": {"The modification time": "touch -m ng 755.", "744": "744 would also remove execute for group and other. umask 022 does not clear execute.", "644": "644 is the file result for umask 022, not the directory result.", "777": "777 is the directory mode before umask 022 is applied."}}, {"q": "With umask 022, what default permission results for a file?", "options": ["755", "700", "644", "666"], "answer": "644", "why": {"644": "a new file starts from 666, with no execute bit, and umask 022 clears write for group and other, leaving 644.", "755": "755 is the directory result. Files do not receive execute from the base mode 666.", "700": "700 would clear the whole group and other fields. umask 022 only clears write for group and other.", "666": "666 is the file mode before umask 022 is applied."}}, {"q": "Which command displays numeric UID and GID for a file?", "options": ["id file.txt", "ls -n file.txt", "groups file.txt", "whoami file.txt"], "answer": "ls -n file.txt", "why": {"ls -n file.txt": "ls -n is a long listing that prints the numeric UID and GID.", "id file.txt": "id prints the current process IDs. This reviewer uses ls -n to show the file's numeric owner.", "groups file.txt": "groups lists group names for the current user. It does not print the file's UID and GID.", "whoami file.txt": "whoami prints the login name. It is not the numeric listing for the file."}}, {"q": "Which command displays numeric and alphabetic EUID, UID, and GID?", "options": ["groups", "id", "ls -n", "who"], "answer": "id", "why": {"id": "id prints the numeric and name forms of the effective UID, UID, and GID.", "groups": "groups prints group names only.", "ls -n": "ls -n prints numeric IDs on a file listing, not the EUID, UID, and GID summary.", "who": "who lists logged-on sessions."}}, {"q": "Which command lists the group memberships of the current user?", "options": ["groups", "id -g", "whoami", "env"], "answer": "groups", "why": {"groups": "groups lists the groups the current user belongs to.", "id -g": "id -g prints only the primary group ID, not the membership list.", "whoami": "whoami prints the username.", "env": "env prints environment variables."}}, {"q": "Which shell path is identified as the Bourne (Again) SHell?", "options": ["/usr/bin/csh", "/usr/bin/ksh", "/bin/bash", "/usr/old/bin/sh"], "answer": "/bin/bash", "why": {"/bin/bash": "bash, the Bourne Again Shell, is /bin/bash.", "/usr/bin/csh": "/usr/bin/csh is the C shell.", "/usr/bin/ksh": "/usr/bin/ksh is the Korn shell.", "/usr/old/bin/sh": "/usr/old/bin/sh is the older Bourne shell path in this material, not bash."}}];

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

let deck = [];
let i = 0;
let correct = 0;
let locked = false;
let missed = [];

const panel = document.getElementById("panel");
const prog = document.getElementById("prog");
const count = document.getElementById("count");
const scoreline = document.getElementById("scoreline");

function start(pool) {
  deck = shuffle(pool.map((q) => ({ ...q, options: shuffle(q.options) })));
  i = 0; correct = 0; missed = []; locked = false;
  render();
}

function render() {
  if (i >= deck.length) return results();
  const q = deck[i];
  prog.style.width = ((i / deck.length) * 100) + "%";
  count.textContent = "Question " + (i + 1) + " of " + deck.length;
  scoreline.textContent = "Score " + correct;
  locked = false;
  panel.innerHTML = `<p class="q">${esc(q.q)}</p>
    <p class="hint">Pick one answer.</p>
    <div id="opts">${q.options.map((opt) => `<button class="opt" type="button" data-v="${encodeURIComponent(opt)}">${esc(opt)}</button>`).join("")}</div>
    <div class="actions"></div>
    <div class="fb" id="fb"></div>`;
  panel.querySelectorAll(".opt").forEach((btn) => {
    btn.onclick = () => {
      if (locked) return;
      finish(q, decodeURIComponent(btn.dataset.v));
    };
  });
}

function finish(q, picked) {
  if (locked) return;
  locked = true;
  const ok = picked === q.answer;
  panel.querySelectorAll(".opt").forEach((b) => {
    const v = decodeURIComponent(b.dataset.v);
    b.disabled = true;
    if (v === q.answer) b.classList.add("ok");
    else if (v === picked) b.classList.add("no");
  });
  const fb = document.getElementById("fb");
  fb.className = "fb " + (ok ? "ok" : "no");
  fb.textContent = ok ? "Correct." : "Not quite.";
  if (ok) correct++;
  else {
    const why = q.why || {};
    missed.push({ q: q.q, answer: q.answer, picked, whyWrong: why[picked] || "", whyRight: why[q.answer] || "" });
    const box = document.createElement("div");
    box.id = "reasons";
    fb.after(box);
    box.innerHTML = `<p class="answer-line">Right answer: <b>${esc(q.answer)}</b></p>
      <p class="why-h">Why</p>
      <div class="explain">
        <p><b>${esc(picked)}</b> is wrong because ${esc(why[picked] || "")}</p>
        <p><b>${esc(q.answer)}</b> is right because ${esc(why[q.answer] || "")}</p>
      </div>`;
  }
  scoreline.textContent = "Score " + correct;
  const actions = panel.querySelector(".actions");
  const next = document.createElement("button");
  next.className = "btn";
  next.type = "button";
  next.textContent = i + 1 === deck.length ? "See results" : "Next";
  actions.replaceChildren(next);
  next.focus();
  next.onclick = () => { i++; render(); };
}

function results() {
  prog.style.width = "100%";
  count.textContent = "Round complete";
  scoreline.textContent = "";
  const pct = Math.round((correct / deck.length) * 100);
  panel.innerHTML = `
    <p class="q">You scored</p>
    <div class="score">${correct} / ${deck.length}</div>
    <p class="sub" style="margin:0">${pct}% · ${missed.length ? missed.length + " to review" : "Clean round."}</p>
    ${missed.length ? `<ul class="miss">${missed.map((m) => `<li><b>${esc(m.q)}</b><br>Right answer: <b>${esc(m.answer)}</b><br>${esc(m.picked)} is wrong because ${esc(m.whyWrong)} ${esc(m.answer)} is right because ${esc(m.whyRight)}</li>`).join("")}</ul>` : ""}
    <div class="actions">
      <a class="btn ghost" href="index.html">Linux exams</a>
      <button class="btn" id="again" type="button">Play again</button>
      ${missed.length ? `<button class="btn ghost" id="missed" type="button">Replay missed only</button>` : ""}
    </div>`;
  document.getElementById("again").onclick = () => start(BANK);
  const missBtn = document.getElementById("missed");
  if (missBtn) {
    missBtn.onclick = () => {
      const ids = new Set(missed.map((m) => m.q));
      start(BANK.filter((q) => ids.has(q.q)));
    };
  }
}

start(BANK);

  </script>
</body>
</html>
