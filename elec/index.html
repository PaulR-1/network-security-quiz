  <script>
    const BANK = [{"id": 1, "q": "It is added to increase the number of conduction band electrons in intrinsic silicon.", "options": ["quadravalent", "pentavalent", "trivalent", "none of the above"], "answer": ["pentavalent"], "why": {"pentavalent": "A pentavalent atom has five valence electrons. In silicon it donates the extra electron, so it is a donor impurity.", "quadravalent": "Silicon itself is quadravalent, with four valence electrons. Adding more silicon does not increase the conduction electrons.", "trivalent": "A trivalent atom has three valence electrons. It creates a hole, not an extra conduction electron.", "none of the above": "Pentavalent doping is the impurity used for this."}, "explain": "A pentavalent atom has five valence electrons. In silicon it donates the extra electron, so it is a donor impurity."}, {"id": 2, "q": "In their normal (or neutral) state, all atoms of a given element have the different number of electrons as protons, the positive charges cancel the negative charges, and the atom has a net charge of zero.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "A neutral atom does not have a different number of electrons and protons. The counts are equal, which is why the net charge is zero.", "False": "The sentence says the counts are different. In a neutral atom they are equal, so the statement is false."}, "explain": "The sentence says the counts are different. In a neutral atom they are equal, so the statement is false."}, {"id": 3, "q": "The single-element conductors are characterized by atoms with four valence electrons.", "options": ["True", "False"], "answer": ["True"], "why": {"True": "The keyed statement matches the textbook line about the single-element materials in this chapter, silicon and germanium, which have four valence electrons.", "False": "The key marks the statement true because silicon and germanium, the single-element semiconductors of this topic, have four valence electrons."}, "explain": "The keyed statement matches the textbook line about the single-element materials in this chapter, silicon and germanium, which have four valence electrons."}, {"id": 4, "q": "It refers to a crystal that has no impurities.", "options": ["none of the above", "doping", "intrinsic", "extrinsic"], "answer": ["intrinsic"], "why": {"intrinsic": "An intrinsic crystal is pure. No impurity atoms have been added.", "none of the above": "Intrinsic is the name for a pure crystal.", "doping": "Doping is the process of adding impurities.", "extrinsic": "An extrinsic crystal is one that has been doped."}, "explain": "An intrinsic crystal is pure. No impurity atoms have been added."}, {"id": 5, "q": "The current flows through the load resistor in this circuit during the", "options": ["positive half cycle of the input waveform", "entire input waveform", "The diode will block all current and there will be no current flowing through the load", "negative half cycle of the input waveform"], "answer": ["positive half cycle of the input waveform"], "why": {"positive half cycle of the input waveform": "The key describes a half-wave rectifier that conducts on the positive half and blocks the negative half. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key.", "entire input waveform": "A single diode does not conduct for the whole cycle.", "The diode will block all current and there will be no current flowing through the load": "The key says current does flow, on the positive half.", "negative half cycle of the input waveform": "That would be the opposite diode direction from the one in the key."}, "explain": "The key describes a half-wave rectifier that conducts on the positive half and blocks the negative half. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key."}, {"id": 6, "q": "The other name for trivalent atom is called a DONOR ATOM.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "A trivalent atom is an acceptor, not a donor.", "False": "A donor atom is pentavalent. A trivalent atom accepts an electron, so it is an acceptor atom."}, "explain": "A donor atom is pentavalent. A trivalent atom accepts an electron, so it is an acceptor atom."}, {"id": 7, "q": "It is created by the interaction of the valence electrons of the atoms.", "options": ["covalent band", "energy band", "all of the above", "conduction band"], "answer": ["energy band"], "why": {"energy band": "When valence electrons of neighboring atoms interact in the crystal, their discrete levels spread into energy bands.", "covalent band": "The sharing itself is a covalent bond. “Covalent band” is not the band created by that interaction.", "all of the above": "The conduction band is only one of the bands, and “covalent band” is not a standard name here.", "conduction band": "The conduction band is where free electrons move. The interaction creates the band structure, not only that one band."}, "explain": "When valence electrons of neighboring atoms interact in the crystal, their discrete levels spread into energy bands."}, {"id": 8, "q": "For this series diode configuration, use the diode characteristic to estimate the value of V_D.", "options": ["10V", "0.92V", "9.2V", "92 mV"], "answer": ["0.92V"], "why": {"0.92V": "The key reads about 0.92 V from the diode curve, a silicon diode operating a little above the 0.7 V knee. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key.", "10V": "10 V would be the source or resistor drop, not the forward diode drop.", "9.2V": "9.2 V is far above a forward diode voltage.", "92 mV": "92 mV is below even a germanium forward drop."}, "explain": "The key reads about 0.92 V from the diode curve, a silicon diode operating a little above the 0.7 V knee. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key."}, {"id": 9, "q": "The core is everything except the valence electrons.", "options": ["True", "False"], "answer": ["True"], "why": {"True": "The core is the nucleus plus all inner shells. The valence electrons are the part left outside that core.", "False": "That definition is the one used in this chapter, so the statement is true."}, "explain": "The core is the nucleus plus all inner shells. The valence electrons are the part left outside that core."}, {"id": 10, "q": "It is the majority carriers in the p-type material.", "options": ["none of the above", "neutrons", "electrons", "protons"], "answer": ["none of the above"], "why": {"none of the above": "The majority carriers in p-type material are holes. Holes are not in the list. The PDF key says protons, but protons stay in the nucleus and are not the carriers.", "neutrons": "Neutrons have no charge and do not carry current.", "electrons": "Electrons are the majority carriers in n-type material. In p-type they are the minority carriers.", "protons": "The PDF key prints protons. Protons are not mobile carriers in the crystal."}, "explain": "The majority carriers in p-type material are holes. Holes are not in the list. The PDF key says protons, but protons stay in the nucleus and are not the carriers."}, {"id": 11, "q": "It is a crystalline material.", "options": ["copper", "silicon", "carbon", "germanium"], "answer": ["silicon"], "why": {"silicon": "In this chapter silicon is the crystalline semiconductor being discussed. The key selects silicon.", "copper": "Copper is the conductor example, not the crystalline semiconductor of this item.", "carbon": "Carbon can form a crystal, but it is not the answer the key gives.", "germanium": "Germanium is also a crystalline semiconductor. The key still selects silicon."}, "explain": "In this chapter silicon is the crystalline semiconductor being discussed. The key selects silicon."}, {"id": 12, "q": "When tested with an ohmmeter, a diode should have a relatively small resistance for ____ condition.", "options": ["both reverse- and forward-biased", "zero-biased", "the forward-biased", "the reverse-biased"], "answer": ["the forward-biased"], "why": {"the forward-biased": "Forward bias turns the diode on, so the ohmmeter reads a relatively small resistance.", "both reverse- and forward-biased": "The reverse reading is high, not small.", "zero-biased": "With no bias the diode is not conducting, so the resistance is not the small forward reading.", "the reverse-biased": "Reverse bias gives a very high resistance."}, "explain": "Forward bias turns the diode on, so the ohmmeter reads a relatively small resistance."}, {"id": 13, "q": "Refer to the figure. What is I_2?", "options": ["0.1mA", "0.375mA", "3.75mA", "1mA"], "answer": ["0.375mA"], "why": {"0.375mA": "The printed key is 0.375 mA. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key.", "0.1mA": "Not the value printed in the key.", "3.75mA": "This is ten times the keyed current.", "1mA": "Not the value printed in the key."}, "explain": "The printed key is 0.375 mA. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key."}, {"id": 14, "q": "The practical value of the current I_R in this circuit is ____.", "options": ["5mA", "0A", "0.5mA", "0.5A"], "answer": ["0A"], "why": {"0A": "The practical reverse current of a diode is treated as 0 A. A tiny leakage exists, but it is ignored in this problem. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key.", "5mA": "That would be a forward current, not the practical reverse current.", "0.5mA": "Still a real current. The practical reverse value used here is zero.", "0.5A": "Half an ampere is not a reverse leakage current."}, "explain": "The practical reverse current of a diode is treated as 0 A. A tiny leakage exists, but it is ignored in this problem. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key."}, {"id": 15, "q": "In an atom, the orbits are grouped into energy bands known as ____.", "options": ["valence band", "covalent bond", "shell", "energy gap"], "answer": ["shell"], "why": {"shell": "The orbits are grouped into shells, such as the K, L, and M shells.", "valence band": "The valence band is an energy band of the crystal, not the grouping of orbits in one atom.", "covalent bond": "A covalent bond is the sharing of electrons between atoms.", "energy gap": "The energy gap is the forbidden region between the valence band and the conduction band."}, "explain": "The orbits are grouped into shells, such as the K, L, and M shells."}, {"id": 16, "q": "Refer to the figure. What is I_4?", "options": ["none of the above", "0.5mA", "1mA", "50mA"], "answer": ["0.5mA"], "why": {"0.5mA": "The printed key is 0.5 mA. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key.", "none of the above": "0.5 mA is one of the choices and is the keyed value.", "1mA": "Not the value printed in the key.", "50mA": "Not the value printed in the key."}, "explain": "The printed key is 0.5 mA. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key."}, {"id": 17, "q": "Refer to the figure. What is V_b?", "options": ["3.75V", "0.375V", "375V", "0.357V"], "answer": ["0.375V"], "why": {"0.375V": "The printed key is 0.375 V. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key.", "3.75V": "This is ten times the keyed voltage.", "375V": "Far above the keyed value.", "0.357V": "Close, but the key prints 0.375 V."}, "explain": "The printed key is 0.375 V. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key."}, {"id": 18, "q": "Refer to the figure. What is I_3?", "options": ["500mA", "1A", "5A", "500 µA"], "answer": ["500 µA"], "why": {"500 µA": "The printed key is 500 µA, which is 0.5 mA. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key.", "500mA": "That is a thousand times larger than 500 µA.", "1A": "Not the value printed in the key.", "5A": "Not the value printed in the key."}, "explain": "The printed key is 500 µA, which is 0.5 mA. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key."}, {"id": 19, "q": "It refers to the movement of the hole from one place to another in the crystal structure.", "options": ["extrinsic", "electron current", "hole current", "intrinsic"], "answer": ["hole current"], "why": {"hole current": "Hole current is the current produced as a vacancy moves through the crystal.", "extrinsic": "Extrinsic describes a doped crystal, not a current.", "electron current": "Electron current is the motion of free electrons, not of the hole.", "intrinsic": "Intrinsic describes a pure crystal, not a current."}, "explain": "Hole current is the current produced as a vacancy moves through the crystal."}, {"id": 20, "q": "It consists of all the inner shells and the nucleus.", "options": ["none of the above", "core", "orbit", "valence band"], "answer": ["core"], "why": {"core": "The core is the nucleus together with the inner shells.", "none of the above": "Core is the term for that combination.", "orbit": "An orbit is one path of an electron, not the whole inner structure.", "valence band": "The valence band is an energy band, not the nucleus plus inner shells."}, "explain": "The core is the nucleus together with the inner shells."}, {"id": 21, "q": "Tightly bound valence electrons can easily break away from their atoms and become free electrons.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "If they are tightly bound, they do not break away easily.", "False": "Tightly bound valence electrons stay with the atom. Electrons must gain enough energy to cross the gap before they become free."}, "explain": "Tightly bound valence electrons stay with the atom. Electrons must gain enough energy to cross the gap before they become free."}, {"id": 22, "q": "It is the smallest particle of an element that retains the characteristics of that element.", "options": ["neutron", "atom", "electron", "proton"], "answer": ["atom"], "why": {"atom": "The atom is the smallest particle of an element that still has that element’s properties.", "neutron": "A neutron is a particle inside the nucleus.", "electron": "An electron is a charge carrier, not the whole element.", "proton": "A proton is a particle inside the nucleus."}, "explain": "The atom is the smallest particle of an element that still has that element’s properties."}, {"id": 23, "q": "Refer to the figure. What is V_a?", "options": ["3V", "none of the above", "4V", "5V"], "answer": ["3V"], "why": {"3V": "The printed key is 3 V. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key.", "none of the above": "3 V is one of the choices and is the keyed value.", "4V": "Not the value printed in the key.", "5V": "Not the value printed in the key."}, "explain": "The printed key is 3 V. The PDF names a figure, but the drawing is not in the file, so this is the printed answer key."}, {"id": 24, "q": "It is used to indicate the motion of the electron.", "options": ["head", "current", "none of the above", "tail"], "answer": ["head"], "why": {"head": "The arrowhead points in the direction of the electron’s motion.", "current": "Current is the flow itself, not the marker on the arrow.", "none of the above": "The head of the arrow is the marker used here.", "tail": "The tail is the back of the arrow, not the end that shows where the electron is going."}, "explain": "The arrowhead points in the direction of the electron’s motion."}, {"id": 25, "q": "It is the process of losing a valence electron.", "options": ["recombination", "hole", "ionization", "depletion"], "answer": ["ionization"], "why": {"ionization": "Ionization is an atom losing a valence electron and becoming a positive ion.", "recombination": "Recombination is a free electron falling back into a hole.", "hole": "A hole is the vacancy left behind. It is not the process.", "depletion": "Depletion is the region near a junction that has lost its mobile carriers."}, "explain": "Ionization is an atom losing a valence electron and becoming a positive ion."}, {"id": 26, "q": "The correct way to illuminate an LED is to", "options": ["place the LED in series with a resistor and a 5 V dc supply with the anode toward the positive side of the supply", "place the LED in series with a resistor and a 5 V dc supply with the cathode toward the positive side of the supply", "place the LED in forward bias directly across a 5 V dc supply", "place the LED in reverse bias directly across a 5 V dc supply"], "answer": ["place the LED in series with a resistor and a 5 V dc supply with the anode toward the positive side of the supply"], "why": {"place the LED in series with a resistor and a 5 V dc supply with the anode toward the positive side of the supply": "The anode goes to the positive side so the LED is forward biased, and the series resistor limits the current.", "place the LED in series with a resistor and a 5 V dc supply with the cathode toward the positive side of the supply": "That connection is reverse bias, so the LED stays off.", "place the LED in forward bias directly across a 5 V dc supply": "With no series resistor the current is not limited and the LED can be destroyed.", "place the LED in reverse bias directly across a 5 V dc supply": "Reverse bias does not light the LED, and it can also exceed the reverse voltage rating."}, "explain": "The anode goes to the positive side so the LED is forward biased, and the series resistor limits the current."}, {"id": 27, "q": "There are an equal number of holes in the valence band created when electrons jump into the conduction band.", "options": ["True", "False"], "answer": ["True"], "why": {"True": "Each electron that leaves the valence band leaves one hole behind, so the numbers match.", "False": "The statement matches the creation of electron-hole pairs, so it is true."}, "explain": "Each electron that leaves the valence band leaves one hole behind, so the numbers match."}, {"id": 28, "q": "It refers to the escape electron.", "options": ["free electron", "none of the above", "both a & b", "conduction electron"], "answer": ["both a & b"], "why": {"both a & b": "An electron that has escaped into the conduction band is called both a free electron and a conduction electron.", "free electron": "That name is right, but it is not the only name. The key includes both names.", "none of the above": "Both listed names refer to the escaped electron.", "conduction electron": "That name is right, but it is not the only name. The key includes both names."}, "explain": "An electron that has escaped into the conduction band is called both a free electron and a conduction electron."}, {"id": 29, "q": "It occurs when a conduction band electron loses energy and falls back into a hole in the valence band.", "options": ["doping", "diffusion", "recombination", "covalent band"], "answer": ["recombination"], "why": {"recombination": "Recombination is a free electron dropping back into a hole.", "doping": "Doping is adding an impurity atom.", "diffusion": "Diffusion is carriers spreading from a crowded region to a less crowded one.", "covalent band": "That is not the name of an electron falling into a hole."}, "explain": "Recombination is a free electron dropping back into a hole."}, {"id": 30, "q": "A given atom has a variable number of shells.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "The number of shells is not variable for a given atom.", "False": "A given atom has a fixed set of shells. The number does not vary."}, "explain": "A given atom has a fixed set of shells. The number does not vary."}, {"id": 31, "q": "It is a material that easily conducts electrical current.", "options": ["conductor", "semiconductor", "all of the above", "insulator"], "answer": ["conductor"], "why": {"conductor": "A conductor has many free electrons and carries current easily.", "semiconductor": "A semiconductor conducts only under the right conditions. It is between a conductor and an insulator.", "all of the above": "An insulator does not conduct easily.", "insulator": "An insulator has very few free electrons and does not conduct under normal conditions."}, "explain": "A conductor has many free electrons and carries current easily."}, {"id": 32, "q": "It is the movement of free electrons in one type of current in a semiconductive material and is called ____.", "options": ["Electron-current", "Hole-current", "all of the above", "current"], "answer": ["Electron-current"], "why": {"Electron-current": "Current made of moving free electrons is electron current.", "Hole-current": "Hole current is the movement of holes, not of free electrons.", "all of the above": "Hole current is a different carrier.", "current": "Current is the general word. The specific name asked for is electron current."}, "explain": "Current made of moving free electrons is electron current."}, {"id": 33, "q": "It is the amount of energy that a valence electron must have in order to jump from the valence band to the conduction band.", "options": ["covalent", "none of the above", "energy gap", "electron"], "answer": ["energy gap"], "why": {"energy gap": "The energy gap is the energy a valence electron must gain to reach the conduction band.", "covalent": "Covalent describes the bond, not that required energy.", "none of the above": "Energy gap is the term.", "electron": "The electron is the particle that jumps. The energy it needs is the gap."}, "explain": "The energy gap is the energy a valence electron must gain to reach the conduction band."}, {"id": 34, "q": "The following are single-element semiconductors except", "options": ["silicon", "carbon", "aluminum", "germanium"], "answer": ["aluminum"], "why": {"aluminum": "Aluminum is a conductor, not a single-element semiconductor ge."}, {"id": 38, "q": "It is added to increase the number of holes in intrinsic silicon.", "options": ["trivalent", "pentavalent", "none of the above", "hexavalent"], "answer": ["trivalent"], "why": {"trivalent": "A trivalent atom has three valence electrons, so it leaves a hole when it bonds in silicon.", "pentavalent": "A pentavalent atom adds a free electron, which makes n-type material.", "none of the above": "Trivalent is the impurity that increases holes.", "hexavalent": "A hexavalent atom is not the acceptor used here."}, "explain": "A trivalent atom has three valence electrons, so it leaves a hole when it bonds in silicon."}, {"id": 39, "q": "Electrons remaining in the valence band are still attached to their atoms and are free to move randomly in the crystal structure as are the free electrons.", "options": ["True", "False"], "answer": ["False"], "why": {"True": "Valence electrons that are still attached are not free to wander like conduction electrons.", "False": "Electrons still in the valence band are bound. Only electrons that have reached the conduction band move freely."}, "explain": "Electrons still in the valence band are bound. Only electrons that have reached the conduction band move freely."}, {"id": 40, "q": "It is the majority carriers in the n-type material.", "options": ["neutrons", "all of the above", "protons", "electrons"], "answer": ["electrons"], "why": {"electrons": "Donor atoms add free electrons, so electrons are the majority carriers in n-type material.", "neutrons": "Neutrons do not carry current.", "all of the above": "Protons and neutrons are not the majority carriers.", "protons": "Protons stay in the nucleus."}, "explain": "Donor atoms add free electrons, so electrons are the majority carriers in n-type material."}, {"id": 41, "q": "All shells in a given atom must be completely filled with electrons except the outer (valence) shell.", "options": ["True", "False"], "answer": ["True"], "why": {"True": "Inner shells are full. Only  table orders elements by atomic number, the number of protons.", "electron": "Electron count can change when an atom ionizes. The table uses atomic number.", "all of the above": "Only the atomic number sets the order.", "proton": "The proton count is the atomic number, but the name of the ordering quantity is atomic number."}, "explain": "The periodic table orders elements by atomic number, the number of protons."}, {"id": 49, "q": "It is the electron in the outermost shell.", "options": ["valence", "escaped electron", "none of the above", "valence electron"], "answer": ["valence electron"], "why": {"valence electron": "A valence electron is an electron in the outermost shell.", "valence": "Valence is the property. The particle is the valence electron.", "escaped electron": "An escaped electron has already left the atom.", "none of the above": "Valence electron is the name."}, "explain": "A valence electron is an electron in the outermost shell."}, {"id": 50, "q": "The maximum number of electrons that can exist in the fourth shell is", "options": ["23", "64", "32", "18"], "answer": ["32"], "why": {"32": "The maximum is 2n². For shell 4, 2 × 16 = 32.", "23": "23 is not 2n² for any of these shells.", "64": "64 would be n² without the factor of 2, or 2n² for a higher shell.", "18": "18 is the maximum for the third shell, 2 × 9."}, "explain": "The maximum is 2n². For shell 4, 2 × 16 = 32."}, {"id": 51, "q": "It is a material that is between conductors and insulators in its ability to conduct electrical current.", "options": ["insulator", "conductor", "all of the above", "semiconductor"], "answer": ["semiconductor"], "why": {"semiconductor": "A semiconductor conducts better than an insulator and worse than a conductor.", "insulator": "An insulator is at the low end, not between the two.", "conductor": "A conductor is at the high end, not between the two.", "all of the above": "Only the semiconductor sits between them."}, "explain": "A semiconductor conducts better than an insulator and worse than a conductor."}, {"id": 52, "q": "Electrons orbit the nucleus of an atom at certain distances from the nucleus.", "options": ["True", "False"], "answer": ["True"], "why": {"True": "Electrons occupy definite shells at definite distances from the nucleus.", "False": "The orbits are at specific distances, so the statement is true."}, "explain": "Electrons occupy definite shells at definite distances from the nucleus."}, {"id": 53, "q": "Because the trivalent atom can take an electron, it is often referred to as an ____.", "options": ["dope element", "extrinsic", "donor", "acceptor"], "answer": ["acceptor"], "why": {"acceptor": "A trivalent atom can take an electron to complete its bond, so it is an acceptor.", "dope element": "That is not the name for the atom that takes an electron.", "extrinsic": "Extrinsic describes the doped crystal.", "donor": "A donor gives an electron. A trivalent atom takes one."}, "explain": "A trivalent atom can take an electron to complete its bond, so it is an acceptor."}];
    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    let deck = [], i = 0, correct = 0, locked = false, missed = [];
    const panel = document.getElementById("panel");
    const prog = document.getElementById("prog");
    const count = document.getElementById("count");
    const scoreline = document.getElementById("scoreline");
    function start(pool) {
      deck = shuffle(pool.map((q) => ({ ...q, options: shuffle(q.options) })));
      i = 0; correct = 0; missed = []; locked = false; render();
    }
    function render() {
      if (i >= deck.length) return results();
      const q = deck[i];
      prog.style.width = ((i / deck.length) * 100) + "%";
      count.textContent = "Question " + (i + 1) + " of " + deck.length + "  ·  #" + q.id;
      scoreline.textContent = "Score " + correct;
      locked = false;
      panel.innerHTML = `<p class="q">${esc(q.q)}</p>
        <div id="opts">${q.options.map((opt) => `<button class="opt" data-v="${encodeURIComponent(opt)}">${esc(opt)}</button>`).join("")}</div>
        <div class="actions"></div><div class="fb" id="fb"></div>`;
      panel.querySelectorAll(".opt").forEach((btn) => {
        btn.onclick = () => { if (!locked) finish(q, decodeURIComponent(btn.dataset.v)); };
      });
    }
    function finish(q, chosen) {
      if (locked) return;
      locked = true;
      const ok = chosen === q.answer[0];
      panel.querySelectorAll(".opt").forEach((b) => {
        const v = decodeURIComponent(b.dataset.v);
        b.disabled = true;
        if (v === q.answer[0]) b.classList.add("ok");
        else if (v === chosen) b.classList.add("no");
      });
      if (ok) correct++; else missed.push({ q: q.q, label: "#" + q.id, msg: q.explain });
      const fb = document.getElementById("fb");
      fb.className = "fb " + (ok ? "ok" : "no");
      fb.textContent = ok ? "Correct." : "Not quite.";
      const why = q.why || {};
      const right = `<li><b>${esc(q.answer[0])}</b> — ${esc(why[q.answer[0]] || "")}</li>`;
      const wrong = q.options.filter((o) => o !== q.answer[0]).map((o) => `<li><b>${esc(o)}</b> — ${esc(why[o] || "")}</li>`).join("");
      const box = document.createElement("div");
      box.innerHTML = `<p class="why-h">WHY THIS IS RIGHT</p><ul class="why">${right}</ul><p class="why-h">WHY THE OTHERS ARE WRONG</p><ul class="why">${wrong}</ul>`;
      fb.after(box);
      scoreline.textContent = "Score " + correct;
      panel.querySelector(".actions").innerHTML = `<button class="btn" id="next">${i + 1 === deck.length ? "See results" : "Next"}</button>`;
      document.getElementById("next").onclick = () => { i++; render(); };
    }
    function results() {
      prog.style.width = "100%";
      count.textContent = "Round complete";
      scoreline.textContent = "";
      const pct = Math.round((correct / deck.length) * 100);
      panel.innerHTML = `<p class="q">You scored</p><div class="score">${correct} / ${deck.length}</div>
        <p class="sub" style="margin:0">${pct}% · ${missed.length ? missed.length + " to review" : "Clean round."}</p>
        ${missed.length ? `<ul class="miss">${missed.map((m) => `<li><b>${esc(m.label)} ${esc(m.q)}</b><br>${esc(m.msg)}</li>`).join("")}</ul>` : ""}
        <div class="actions"><a class="btn ghost" href="../index.html">All reviewers</a>
        <button class="btn" id="again">Play again (shuffle)</button>
        ${missed.length ? `<button class="btn ghost" id="missed">Replay missed only</button>` : ""}</div>`;
      document.getElementById("again").onclick = () => start(BANK);
      const missBtn = document.getElementById("missed");
      if (missBtn) missBtn.onclick = () => { const ids = new Set(missed.map((m) => m.q)); start(BANK.filter((q) => ids.has(q.q))); };
    }
    start(BANK);
  </script>
